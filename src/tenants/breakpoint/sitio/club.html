// ───────────────────────── plata pendiente (no vence) ─────────────────────────

const ddmm = (f) => (f ? `${f.slice(8)}/${f.slice(5, 7)}` : "");
const telDeFicha = (estado, clienteId) => (clienteId ? cliente(estado, clienteId)?.tel ?? "" : "");
const ordenFechaHora = (x) => `${x.fecha ?? "9999-99-99"}|${String(x.inicio ?? 9999).padStart(4, "0")}`;

/**
 * Toda la plata que quedó pendiente, de CUALQUIER fecha, hasta que alguien la resuelve (nada vence ni se pierde de
 * vista): lo que hay que devolver en mano, la falta de alguien sin ficha, la seña de un turno que venció sin pagarse y
 * los fiados de una cuenta que esperan (o ya tienen) el OK del dueño. De lo más viejo a lo más nuevo. Cada ítem trae
 * con quién es (nombre y celular de su ficha, si la tiene), de qué turno o cuenta, el monto exacto, si la plata entra o
 * sale, y el texto y el botón en criollo. Las acciones que lo resuelven son las de siempre (`marcarDevuelto`,
 * `cobrarFaltaSinFicha`, `registrarPago` de la seña, `cerrarCuenta` a cuenta corriente, `pagarCuenta`).
 */
function plataPendiente(estado) {
  const out = [];
  for (const r of estado.reservas) {
    const delTurno = { reservaId: r.id, clienteId: r.clienteId ?? null, nombre: r.titular, tel: telDeFicha(estado, r.clienteId), fecha: r.fecha, inicio: r.inicio, canchaId: r.canchaId };
    const turno = `turno del ${ddmm(r.fecha)} ${hhmm(r.inicio)}`;
    if (r.devolucionPendiente > 0)
      out.push({ tipo: "devolucion", clave: `devolucion:${r.id}`, ...delTurno, monto: r.devolucionPendiente, sentido: "sale", texto: `Devolver ${pesos(r.devolucionPendiente)} a ${r.titular} (${turno})`, accion: "Devolver" });
    if (r.deudaSinFicha > 0)
      out.push({ tipo: "falta_sin_ficha", clave: `falta_sin_ficha:${r.id}`, ...delTurno, monto: r.deudaSinFicha, sentido: "entra", texto: `${r.titular} debe la falta del ${ddmm(r.fecha)} · ${pesos(r.deudaSinFicha)}`, accion: "Cobrar" });
    if (r.estado === "reservada" && r.senaVencida && r.sena.monto > 0 && !r.sena.pagada) {
      const falta = Math.max(0, r.sena.monto - cobrado(r));
      if (falta > 0) out.push({ tipo: "sena_vencida", clave: `sena_vencida:${r.id}`, ...delTurno, monto: falta, sentido: "entra", texto: `${r.titular}: venció el plazo de la seña de ${pesos(falta)} (${turno})`, accion: "Cobrar la seña" });
    }
  }
  // El último pedido de fiado de cada cuenta que sigue abierta.
  const ultimo = new Map();
  for (const n of estado.novedades) if (n.tipo === "fiado" && n.cuentaId) ultimo.set(n.cuentaId, n);
  for (const [cuentaId, n] of ultimo) {
    const cta = cuenta(estado, cuentaId);
    if (!cta || cta.estado !== "abierta") continue;
    const c = cliente(estado, n.clienteId);
    const nombre = c?.nombre ?? cta.titular;
    const debe = deudaDe(estado, cta);
    const base = { tipo: "fiado", clave: `fiado:${n.id}`, novedadId: n.id, cuentaId, clienteId: n.clienteId ?? null, nombre, tel: c?.tel ?? "", fecha: n.fecha ?? null, inicio: n.min ?? null, canchaId: null, sentido: "entra", cerrarAlAprobar: !!n.cerrarAlAprobar, pidio: n.pidio };
    if (n.estado === "pendiente")
      out.push({ ...base, monto: n.monto, estadoFiado: "esperando", texto: `${nombre}: fiado de ${pesos(n.monto)} esperando el OK del dueño (lo pidió ${n.pidio})`, accion: n.cerrarAlAprobar ? "Se cierra sola al aprobar" : "Esperando OK" });
    else if (n.estado === "aprobada" && debe > 0)
      out.push({ ...base, monto: debe, estadoFiado: "aprobado", aprobo: n.resolvio ?? null, texto: `Aprobado por ${n.resolvio ?? "el dueño"}: ${nombre} pasa ${pesos(debe)} a su cuenta corriente${n.noSeCerro ? ` (no se pudo cerrar sola: ${n.noSeCerro})` : ""}`, accion: "Pasar a su cuenta corriente" });
    else if (n.estado === "rechazada" && n.cerrarAlAprobar && debe > 0)
      // Se fue esperando el OK y el dueño dijo que no: la cuenta queda para cobrarle cuando vuelva.
      out.push({ ...base, monto: debe, estadoFiado: "rechazado", aprobo: n.resolvio ?? null, texto: `${n.resolvio ?? "El dueño"} no aprobó el fiado de ${nombre}: la cuenta sigue abierta con ${pesos(debe)}`, accion: "Cobrar la cuenta" });
  }
  return out.sort((a, b) => ordenFechaHora(a).localeCompare(ordenFechaHora(b)));
}

const diasEntre = (desde, hasta) => Math.round((Date.parse(`${hasta}T00:00:00Z`) - Date.parse(`${desde}T00:00:00Z`)) / 86400000);

/**
 * Los remitos con fecha de pago (`vence`) que todavía se deben y vencen dentro de `dias` días (o ya vencieron). Lo
 * pagado a cada proveedor cubre sus remitos del más viejo al más nuevo. `enDias`: 0 hoy, 1 mañana, negativo si venció.
 */
function pagosPorVencer(estado, ahora, dias = 7) {
  const out = [];
  for (const pv of estado.proveedores) {
    const remitos = estado.remitos.filter((r) => r.proveedorId === pv.id).sort((a, b) => `${a.fecha ?? ""}|${String(a.min ?? 0).padStart(4, "0")}`.localeCompare(`${b.fecha ?? ""}|${String(b.min ?? 0).padStart(4, "0")}`));
    let pagado = estado.pagosProveedor.filter((p) => p.proveedorId === pv.id).reduce((s, p) => s + p.monto, 0);
    for (const r of remitos) {
      const cubre = Math.min(pagado, r.total);
      pagado -= cubre;
      const debe = r.total - cubre;
      if (!(debe > 0) || !esFecha(r.vence)) continue;
      const enDias = diasEntre(ahora.fecha, r.vence);
      if (enDias <= dias) out.push({ remitoId: r.id, proveedorId: pv.id, proveedor: pv.nombre, numero: r.numero, vence: r.vence, monto: debe, enDias });
    }
  }
  return out.sort((a, b) => a.enDias - b.enDias);
}

/** Las alertas que se pueden posponer hasta mañana (las demás son de hoy y no tiene sentido: hay que resolverlas). */
const ALERTAS_POSPONIBLES = Object.freeze(["cierreConDiferencia", "vencePago", "aparte", "stock"]);

/** La clave de una alerta: su tipo y a qué se refiere. Es la misma entre armados (y la que guarda una pospuesta). */
function claveDeAlerta(a) {
  const ref = a.reservaId ?? a.pedidoId ?? a.novedadId ?? a.solicitudId ?? a.esperaId ?? a.productoId ?? a.remitoId ?? a.dia ?? a.canchaId ?? "";
  return `${a.tipo}:${ref}`;
}

const pospuestaVigente = (estado, clave, ahora) => (estado.alertasPospuestas ?? []).some((p) => p.clave === clave && ahora.fecha < p.hasta);

/**
 * «Posponer hasta mañana»: la alerta no aparece en ninguna bandeja hasta mañana (y mañana, si sigue, vuelve). Sólo
 * las de `ALERTAS_POSPONIBLES`; las del dueño las pospone un dueño. Idempotente.
 */
function posponerAlerta(estado, clave, auth, ahora) {
  const tipo = String(clave ?? "").split(":")[0];
  if (!ALERTAS_POSPONIBLES.includes(tipo)) return { ok: false, motivo: "Eso no se puede dejar para mañana: hay que resolverlo hoy." };
  if (pospuestaVigente(estado, clave, ahora)) return { ok: true, hasta: estado.alertasPospuestas.find((p) => p.clave === clave).hasta, yaEstaba: true };
  const a = alertas(estado, ahora).find((x) => claveDeAlerta(x) === clave);
  if (!a) return { ok: false, motivo: "Eso ya no está para resolver." };
  const ok = autorizar(estado, auth ?? {}, a.paraDuenio ? "metricas" : "agenda", false);
  if (!ok.ok) return a.paraDuenio ? { ok: false, motivo: "Lo del dueño lo pospone un dueño." } : ok;
  const hasta = sumarDias(ahora.fecha, 1);
  // Las vencidas se limpian al pasar (la lista no crece).
  estado.alertasPospuestas = [...(estado.alertasPospuestas ?? []).filter((p) => ahora.fecha < p.hasta && p.clave !== clave), { tipo, clave, hasta, por: ok.usuario.nombre }];
  registrar(estado, `${ok.usuario.nombre} dejó para mañana: ${a.texto}`, ahora);
  return { ok: true, hasta, yaEstaba: false };
}

// ───────────────────────── eventualidades (la bandeja) ─────────────────────────

/**
 * Lo que hay que resolver AHORA, ordenado por urgencia. `paraDuenio: true` marca lo que sólo puede
 * resolver un dueño (autorizaciones); la pantalla lo muestra según quién esté usando el sistema.
 */
function alertas(estado, ahora) {
  const out = [];
  const { politica } = estado.config;
  // Pasada la 01:00, lo que sigue en cancha desde el día anterior también se avisa (y no es «luz sin juego»).
  const ayer = sumarDias(ahora.fecha, -1);
  const hoy = estado.reservas.filter((r) => r.fecha === ahora.fecha || (r.fecha === ayer && r.estado === "en_cancha"));
  for (const r of hoy) {
    const falta = minutosHasta(ahora, r.fecha, r.inicio);
    const fin = falta + r.duracion;
    const nombreCancha = cancha(estado, r.canchaId)?.nombre ?? "";
    const titular = r.clienteId ? cliente(estado, r.clienteId) : null;
    const marcaRoja = titular?.deuda > 0 ? ` ⚠ Debe ${pesos(titular.deuda)} de antes.` : "";
    // Una reserva online dentro de su plazo de seña todavía no es urgente: el jugador está transfiriendo.
    const enPlazo = r.venceSena && minutosHasta(ahora, r.venceSena.fecha, r.venceSena.min) > 0;
    if (r.estado === "reservada" && r.sena.monto > 0 && !r.sena.pagada && !enPlazo && falta > 0 && falta <= politica.minutosAvisoSena)
      out.push({ nivel: "alta", tipo: "sena", reservaId: r.id, texto: `${r.titular} (${hhmm(r.inicio)}, ${nombreCancha}) no pagó la seña.`, accion: "Pedir seña o liberar" });
    if (r.estado === "reservada" && falta < 0 && -falta >= politica.toleranciaMin && fin > 0)
      out.push({ nivel: "alta", tipo: "no_show", reservaId: r.id, texto: `${r.titular} no llegó: van ${-falta} min del turno de las ${hhmm(r.inicio)} (${nombreCancha}). La falta se cobra entera.`, accion: "Llamar o marcar la falta" });
    if (r.estado === "reservada" && falta > 0 && falta <= 15)
      out.push({ nivel: "info", tipo: "llega", reservaId: r.id, texto: `${r.titular} entra en ${falta} min a ${nombreCancha}.${marcaRoja}`, accion: "Recibir" });
    if (r.estado === "en_cancha" && fin <= 0)
      out.push({ nivel: saldo(r) > 0 ? "alta" : "media", tipo: "cerrar", reservaId: r.id, texto: saldo(r) > 0 ? `${r.titular} terminó y la cancha debe ${pesos(saldo(r))}.${marcaRoja}` : `${r.titular} terminó: cerrá la cancha y apagá la luz.`, accion: saldo(r) > 0 ? "Cobrar o sumar a cuenta" : "Cerrar cancha" });
    if (r.estado === "en_cancha" && fin > 0 && fin <= 10)
      out.push({ nivel: "info", tipo: "termina", reservaId: r.id, texto: `${r.titular} termina en ${fin} min (${nombreCancha}).`, accion: "Ofrecer extender" });
  }
  // La plata pendiente de CUALQUIER día (no sólo la de hoy: no vence). Las pantallas nuevas la leen de `plataPendiente`.
  for (const x of plataPendiente(estado)) {
    const r = x.reservaId ? reserva(estado, x.reservaId) : null;
    if (!r) continue;
    const cuando = r.fecha === ahora.fecha ? `las ${hhmm(r.inicio)}` : `el ${ddmm(r.fecha)} ${hhmm(r.inicio)}`;
    if (x.tipo === "devolucion")
      out.push({ nivel: "media", tipo: "devolucion", reservaId: r.id, texto: `Hay que devolverle ${pesos(x.monto)} a ${r.titular} (no tiene ficha${r.fecha === ahora.fecha ? "" : `; turno del ${ddmm(r.fecha)}`}).`, accion: "Registrar la devolución" });
    else if (x.tipo === "falta_sin_ficha")
      out.push({ nivel: "media", tipo: "falta_sin_ficha", reservaId: r.id, texto: `${r.titular} debe la falta de ${cuando}: ${pesos(x.monto)} (no tiene ficha).`, accion: "Cobrar la falta" });
  }
  for (const c of estado.canchas) {
    if (!estado.luces[c.id]) continue;
    if (!hoy.some((r) => r.canchaId === c.id && r.estado === "en_cancha")) out.push({ nivel: "media", tipo: "luz", canchaId: c.id, texto: `Luz prendida en ${c.nombre} sin juego.`, accion: "Apagar" });
  }
  for (const c of estado.canchas.filter((x) => x.estado === "mantenimiento")) {
    const n = hoy.filter((r) => r.canchaId === c.id && r.estado === "reservada" && minutosHasta(ahora, r.fecha, r.inicio) > 0).length;
    if (n) out.push({ nivel: "alta", tipo: "mantenimiento", canchaId: c.id, texto: `${c.nombre} está en mantenimiento y tiene ${n} turno(s) por delante.`, accion: "Reubicar" });
  }
  const lluvia = estado.clima.pronostico;
  if (lluvia && lluvia.fecha === ahora.fecha && !estado.clima.lluvia) {
    const descubiertas = new Set(estado.canchas.filter((c) => !c.cubierta).map((c) => c.id));
    const n = hoy.filter((r) => descubiertas.has(r.canchaId) && ["reservada", "en_cancha"].includes(r.estado) && solapa(r.inicio, r.inicio + r.duracion, lluvia.desde, lluvia.hasta)).length;
    if (n) out.push({ nivel: "alta", tipo: "lluvia", texto: `Anuncian lluvia ${hhmm(lluvia.desde)}–${hhmm(lluvia.hasta)}: ${n} turno(s) en cancha descubierta.`, accion: "Activar plan lluvia" });
  }
  for (const e of estado.espera.filter((x) => x.fecha === ahora.fecha)) {
    for (const c of estado.canchas) {
      const libres = huecosLibres(estado, e.fecha, c.id, e.duracion, Math.max(e.desde, ahora.min)).filter((m) => m <= e.hasta);
      if (libres.length && (!e.soloCubierta || c.cubierta)) {
        out.push({ nivel: "media", tipo: "espera", esperaId: e.id, canchaId: c.id, inicio: libres[0], texto: `Hay lugar para ${e.titular} (lista de espera): ${c.nombre} ${hhmm(libres[0])}.`, accion: "Ofrecer por WhatsApp" });
        break;
      }
    }
  }
  for (const p of estado.productos) {
    if (p.activo !== false && !p.alquiler && p.stock != null && p.stock <= p.minimo)
      out.push({ nivel: p.stock === 0 ? "alta" : "media", tipo: "stock", productoId: p.id, texto: `${p.nombre}: quedan ${p.stock} (mínimo ${p.minimo}).`, accion: "Ver stock" });
  }
  for (const n of estado.novedades.filter((x) => x.estado === "pendiente")) {
    const c = cliente(estado, n.clienteId);
    out.push({ nivel: "media", tipo: "autorizacion", novedadId: n.id, paraDuenio: true, texto: n.tipo === "fiado" ? `${n.pidio} pide fiarle ${pesos(n.monto)} a ${c?.nombre}.` : `${n.pidio} pide cuenta corriente para ${c?.nombre} hasta ${pesos(n.limite)}.`, accion: "Autorizar o rechazar" });
  }
  for (const pd of (estado.pedidos ?? []).filter((x) => x.estado === "pendiente"))
    out.push({ nivel: "media", tipo: "pedido", pedidoId: pd.id, texto: `Pedido de la tienda ${pd.codigo} de ${pd.nombre}: ${pesos(pd.total)} para retirar.`, accion: "Ver pedido" });
  for (const s of estado.solicitudesAcceso.filter((x) => x.estado === "pendiente"))
    out.push({ nivel: "media", tipo: "acceso", solicitudId: s.id, paraDuenio: true, texto: `${s.nombre} pidió acceso al sistema.`, accion: "Dar acceso" });
  // La caja: la que quedó sin cerrar (para todos, en todas las solapas) y el último cierre que no cuadró (para el dueño).
  const atrasadas = cajasSinCerrar(estado, ahora);
  if (atrasadas.length)
    out.push({
      nivel: "alta", tipo: "caja", dia: atrasadas[0], dias: atrasadas,
      texto: atrasadas.length === 1 ? `Quedó la caja del ${ddmm(atrasadas[0])} sin cerrar.` : `Quedaron ${atrasadas.length} cajas sin cerrar (del ${ddmm(atrasadas[0])} al ${ddmm(atrasadas[atrasadas.length - 1])}).`,
      accion: atrasadas.length === 1 ? "Cerrar esa caja" : "Cerrar esas cajas",
    });
  const ultimoCierre = estado.caja.cierres.reduce((u, c) => (!u || c.dia > u.dia ? c : u), null);
  if (ultimoCierre && ultimoCierre.diferencia !== 0 && ultimoCierre.dia >= sumarDias(diaDeCaja(estado, ahora.fecha, ahora.min), -7)) {
    const d = ultimoCierre.diferencia;
    const quien = [String(ultimoCierre.responsable ?? "").replace(/\s*\(.*\)$/, ""), Number.isFinite(ultimoCierre.min) ? hhmm(ultimoCierre.min) : null].filter(Boolean).join(", ");
    out.push({ nivel: "media", tipo: "cierreConDiferencia", dia: ultimoCierre.dia, paraDuenio: true, texto: `La caja del ${ddmm(ultimoCierre.dia)} cerró con ${pesos(Math.abs(d))} de ${d < 0 ? "menos" : "más"}${quien ? ` (${quien})` : ""}.`, accion: "Ver la caja" });
  }
  // Pagos a proveedores que vencen (con fecha de pago en el remito).
  for (const v of pagosPorVencer(estado, ahora)) {
    const cuando = v.enDias < 0 ? `Venció el ${ddmm(v.vence)}` : v.enDias === 0 ? "Hoy vence" : v.enDias === 1 ? "Mañana vence" : `El ${ddmm(v.vence)} vence`;
    out.push({ nivel: v.enDias <= 0 ? "alta" : v.enDias === 1 ? "media" : "info", tipo: "vencePago", remitoId: v.remitoId, proveedorId: v.proveedorId, paraDuenio: true, texto: `${cuando} el pago de ${pesos(v.monto)} a ${v.proveedor} (remito ${v.numero}).`, accion: "Ver el proveedor" });
  }
  // Lo de los puestos que chocó y espera que alguien lo resuelva (la sincronización lo deja en la foto).
  const aparte = esLista(estado.sincro?.paraResolver) ? estado.sincro.paraResolver.length : 0;
  if (aparte) out.push({ nivel: "media", tipo: "aparte", paraDuenio: true, texto: aparte === 1 ? "Quedó 1 cosa de los puestos para resolver." : `Quedaron ${aparte} cosas de los puestos para resolver.`, accion: "Ver lo que quedó aparte" });
  const peso = { alta: 0, media: 1, info: 2 };
  // Lo pospuesto hasta mañana no aparece hoy (posponerAlerta).
  const visibles = estado.alertasPospuestas?.length ? out.filter((a) => !pospuestaVigente(estado, claveDeAlerta(a), ahora)) : out;
  return visibles.sort((a, b) => peso[a.nivel] - peso[b.nivel]);
}

function kpis(estado, fecha, ahora) {
  const { abre, cierra } = horarioDe(estado, fecha);
  const canchasActivas = estado.canchas.filter((c) => c.estado !== "mantenimiento");
  const delDia = estado.reservas.filter((r) => r.fecha === fecha);
  const ocupan = delDia.filter((r) => OCUPA.has(r.estado));
  const minutosDisponibles = canchasActivas.length * (cierra - abre);
  const minutosOcupados = ocupan.reduce((s, r) => s + r.duracion, 0);
  const porFranja = { valle: { ocupado: 0, total: 0 }, pico: { ocupado: 0, total: 0 } };
  for (let m = abre; m < cierra; m += 30) {
    const f = franjaDe(estado, fecha, m);
    porFranja[f].total += canchasActivas.length * 30;
    for (const r of ocupan) if (m >= r.inicio && m < r.inicio + r.duracion) porFranja[f].ocupado += 30;
  }
  const vendido = ocupan.reduce((s, r) => s + totalReserva(r), 0);
  const cobradoTotal = delDia.reduce((s, r) => s + cobrado(r), 0);
  const yaEmpezo = (r) => !ahora || fecha < ahora.fecha || (fecha === ahora.fecha && r.inicio <= ahora.min);
  const porCobrar = delDia.filter((r) => r.estado === "en_cancha" || (r.estado === "reservada" && yaEmpezo(r))).reduce((s, r) => s + Math.max(0, saldo(r)), 0);
  const dia = ahora ? cajaAbierta(estado, ahora) : fecha; // la misma caja que muestra Caja
  const caja = resumenCaja(estado, dia);
  const stockValorizado = estado.productos.reduce((s, p) => s + (p.stock == null ? 0 : p.costo * (p.stock + (p.prestados ?? 0))), 0);
  let buffet = 0;
  for (const cta of estado.cuentas) for (const i of cta.items) if (i.fecha && diaDeCaja(estado, i.fecha, i.min ?? 0) === dia) buffet += i.cant * i.precioUnit;
  const abiertas = cuentasAbiertas(estado);
  return {
    ocupacion: minutosDisponibles ? minutosOcupados / minutosDisponibles : 0,
    ocupacionValle: porFranja.valle.total ? porFranja.valle.ocupado / porFranja.valle.total : 0,
    ocupacionPico: porFranja.pico.total ? porFranja.pico.ocupado / porFranja.pico.total : 0,
    turnos: ocupan.length,
    vendido,
    cobrado: cobradoTotal,
    porCobrar,
    ticketPromedio: ocupan.length ? Math.round(vendido / ocupan.length) : 0,
    buffet,
    cuentasAbiertas: abiertas.length,
    cuentasAbiertasSaldo: abiertas.reduce((s, c) => s + saldoCuenta(c), 0),
    faltas: delDia.filter((r) => r.estado === "no_show").length,
    cancelados: delDia.filter((r) => r.estado === "cancelada").length,
    caja,
    stockValorizado,
    deudaClientes: estado.clientes.reduce((s, c) => s + c.deuda, 0),
    creditos: estado.clientes.reduce((s, c) => s + c.monedero, 0),
    deudaProveedores: estado.proveedores.reduce((s, p) => s + Math.max(0, deudaConProveedor(estado, p.id)), 0),
  };
}

/** Matriz de ocupación día × hora (0..1) para el mapa de calor del dueño. */
function mapaDeCalor(estado, fechas) {
  const abre = Math.min(...fechas.map((f) => horarioDe(estado, f).abre));
  const cierra = Math.max(...fechas.map((f) => horarioDe(estado, f).cierra));
  const horas = [];
  for (let h = abre; h < cierra; h += 60) horas.push(h);
  const n = estado.canchas.filter((c) => c.estado !== "mantenimiento").length || 1;
  const filas = fechas.map((fecha) => {
    const ocupan = estado.reservas.filter((r) => r.fecha === fecha && OCUPA.has(r.estado));
    return {
      fecha,
      valores: horas.map((h) => {
        let ocupado = 0;
        for (const r of ocupan) ocupado += Math.max(0, Math.min(h + 60, r.inicio + r.duracion) - Math.max(h, r.inicio));
        return Math.min(1, ocupado / (60 * n));
      }),
    };
  });
  return { horas, filas };
}

/** Minutos sin uso hasta bloquear la pantalla (0 = sólo al apagarse o esconderse la pantalla). */
const LIMITES_BLOQUEO = Object.freeze([0, 60]);
function ajustarBloqueo(estado, minutos, auth) {
  const a = autorizar(estado, auth, "configurar", false);
  if (!a.ok) return a;
  const v = Math.round(Number(minutos));
  if (!Number.isFinite(v) || v < LIMITES_BLOQUEO[0] || v > LIMITES_BLOQUEO[1]) return { ok: false, motivo: `Entre ${LIMITES_BLOQUEO[0]} y ${LIMITES_BLOQUEO[1]} minutos.` };
  estado.config.bloqueoMin = v;
  return { ok: true, valor: v };
}

/** Límites de las reglas que el dueño edita en vivo. `minutosAntesParaEntrar` vacío = sin límite. */
const LIMITES_POLITICA = Object.freeze({
  horasCancelacionLibre: [0, 72],
  senaPct: [0, 100],
  strikesParaSena: [1, 10],
  toleranciaMin: [0, 60],
  minutosAntesParaEntrar: [0, 240],
});

function ajustarPolitica(estado, clave, valor) {
  const lim = LIMITES_POLITICA[clave];
  if (!lim) return { ok: false, motivo: "Esa regla no existe." };
  if (clave === "minutosAntesParaEntrar" && (valor === "" || valor == null)) { estado.config.politica[clave] = null; return { ok: true, valor: null }; }
  const v = Math.round(Number(valor));
  if (!Number.isFinite(v) || v < lim[0] || v > lim[1]) return { ok: false, motivo: `Tiene que ser entre ${lim[0]} y ${lim[1]}.` };
  estado.config.politica[clave] = v;
  return { ok: true, valor: v };
}

/** Generador pseudoaleatorio con semilla: la demo se ve igual cada vez que se abre el mismo día. */
function azar(semilla) {
  let s = semilla >>> 0;
  return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
}

/**
 * Arma un club con vida: una semana de historia (ocupación, buffet, remitos) y un día de hoy con las
 * eventualidades a la vista.
 */
function generarDemo(hoy, ahoraMin = H(19, 10)) {
  secuencia = 0;
  const rnd = azar(hoy.split("-").reduce((s, x) => s * 31 + Number(x), 7));
  const clientes = NOMBRES.map((nombre, i) => ({
    id: `k${i + 1}`, nombre, tel: `5491100000${String(i + 1).padStart(3, "0")}`, // ficticio a propósito
    strikes: i === 5 ? 2 : i === 11 ? 1 : 0, monedero: i === 2 ? 15000 : 0,
    nivel: ["3ra", "4ta", "5ta", "6ta", "7ma"][i % 5],
    cc: [0, 2, 9, 16].includes(i) ? { habilitada: true, limite: i === 9 ? 50000 : 100000 } : { habilitada: false, limite: 0 },
  }));
  const e = crearEstado({ config: CONFIG_DEMO, canchas: CANCHAS_DEMO, clientes, productos: PRODUCTOS_DEMO, usuarios: USUARIOS_DEMO, proveedores: PROVEEDORES_DEMO });
  e.caja.fondo = 30000;
  // La historia de la demo se arma con la seña de antes (sin «seña a los nuevos»): así los turnos ya dados y la plata
  // de la demo no cambian. La regla vuelve a la de fábrica al terminar, para todo lo que se dé después.
  e.config.politica.senaNuevos = false;
  const ahora = { fecha: hoy, min: ahoraMin };
  const elegir = () => clientes[Math.floor(rnd() * clientes.length)];
  const medios = ["efectivo", "mercadopago", "transferencia", "debito"];
  const platos = PRODUCTOS_DEMO.filter((p) => p.plato);
  const dueno = { usuarioId: "u-rober", pin: "1111" };
  const recep = { usuarioId: "u-lu" };

  crearFijo(e, { clienteId: "k1", canchaId: "c1", dia: diaSemana(hoy), inicio: H(20, 30) });
  crearFijo(e, { clienteId: "k4", canchaId: "c2", dia: diaSemana(hoy), inicio: H(22, 30) });
  crearFijo(e, { clienteId: "k7", canchaId: "c3", dia: (diaSemana(hoy) + 1) % 7, inicio: H(19) });

  const cerrarDemo = (r, fin, partes) => {
    r.estado = "finalizada";
    for (const parte of dividir(saldo(r), partes)) {
      const medio = medios[Math.floor(rnd() * 4)];
      r.pagos.push({ medio, monto: parte, ...fin });
      e.caja.movimientos.push({ id: nuevoId("m"), tipo: "ingreso", medio, monto: parte, concepto: `Cancha ${r.titular}`, reservaId: r.id, ...fin });
    }
  };

  // Historia: los 6 días anteriores, cerrados y cobrados, con consumos de buffet (para métricas de platos).
  for (let d = -6; d <= 0; d++) {
    const fecha = sumarDias(hoy, d);
    const { abre, cierra } = horarioDe(e, fecha);
    materializarFijos(e, fecha);
    const finde = [0, 6].includes(diaSemana(fecha));
    for (const c of e.canchas) {
      for (let m = abre; m + 90 <= cierra; m += 90) {
        const prob = finde ? 0.78 : m >= H(17) ? 0.9 : m < H(11) ? 0.25 : 0.4;
        if (d === 0 && m + 90 > ahoraMin - 90 && m < ahoraMin + 330) continue; // hoy se arma a mano abajo
        const fijo = e.reservas.find((r) => r.fecha === fecha && r.canchaId === c.id && r.inicio === m && r.fijoId);
        if (!fijo && rnd() > prob) continue;
        const r = fijo ?? crearReserva(e, { canchaId: c.id, fecha, inicio: m, clienteId: elegir().id, origen: rnd() > 0.5 ? "whatsapp" : "web" }).reserva;
        if (!r || d === 0 && m + 90 > ahoraMin) continue;
        const fin = { fecha, min: m + 90 };
        // Consumos del buffet de los jugadores (platos y bebidas).
        if (rnd() > 0.35) {
          const { cuenta: cta } = abrirCuenta(e, { clienteId: r.clienteId, titular: r.titular, reservaId: r.id, jugadorIdx: 0 }, fin);
          if (rnd() > 0.3) cta.items.push(itemDemo(e, "p2", 1 + Math.floor(rnd() * 3), fin));

// MORPH — actualiza el DOM cambiando sólo lo distinto, en vez de reemplazar todo con innerHTML.
// Por qué: con innerHTML cada clic borra y vuelve a crear la pantalla → se pierde el foco, el scroll y
// lo que se estaba escribiendo, y se ve un parpadeo. Con morph la pantalla "se queda quieta" y sólo
// cambian los números, chips y bloques que cambiaron (y las transiciones CSS pueden animarse).
//
// Claves de emparejamiento: `id` o `data-k` (si están); si no, el orden. Los <canvas> no se tocan por dentro
// (las cámaras siguen dibujando). Un input con foco no pierde lo que el usuario está escribiendo.

const claveDe = (n) => (n.nodeType === 1 ? n.id || n.getAttribute("data-k") || "" : "");
const mismo = (a, b) => a.nodeType === b.nodeType && a.nodeName === b.nodeName && claveDe(a) === claveDe(b);

// Un <details> que el usuario abrió (o cerró) queda como lo dejó: refrescar la pantalla no se lo cambia.
const delUsuario = (a, name) => name === "open" && a.tagName === "DETAILS";
function atributos(a, b) {
  for (const { name } of [...a.attributes]) if (!b.hasAttribute(name) && !delUsuario(a, name)) a.removeAttribute(name);
  for (const { name, value } of [...b.attributes]) if (a.getAttribute(name) !== value && !delUsuario(a, name)) a.setAttribute(name, value);
}

function nodo(a, b) {
  if (a.nodeType === 3 || a.nodeType === 8) {
    if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue;
    return;
  }
  atributos(a, b);
  const tag = a.tagName;
  if (tag === "CANVAS") return;
  if (tag === "INPUT") {
    const enFoco = a === document.activeElement;
    if (a.type === "checkbox" || a.type === "radio") { if (a.checked !== b.hasAttribute("checked")) a.checked = b.hasAttribute("checked"); }
    else if (!enFoco && a.value !== (b.getAttribute("value") ?? "")) a.value = b.getAttribute("value") ?? "";
    return;
  }
  if (tag === "TEXTAREA") {
    if (a !== document.activeElement && a.value !== b.textContent) a.value = b.textContent;
    return;
  }
  hijos(a, b);
  if (tag === "SELECT") {
    const elegido = b.querySelector("option[selected]") ?? b.querySelector("option");
    if (elegido && a.value !== elegido.value) a.value = elegido.value;
  }
}

function hijos(padre, nuevo) {
  let actual = padre.firstChild;
  for (const n of [...nuevo.childNodes]) {
    if (actual && mismo(actual, n)) { nodo(actual, n); actual = actual.nextSibling; continue; }
    // ¿Está más adelante (mismo id/clave)? Se mueve en lugar de recrearse.
    let match = null;
    const k = claveDe(n);
    if (k) for (let x = actual; x; x = x.nextSibling) if (mismo(x, n)) { match = x; break; }
    if (match) { padre.insertBefore(match, actual); nodo(match, n); continue; }
    padre.insertBefore(n, actual);
  }
  while (actual) { const sig = actual.nextSibling; padre.removeChild(actual); actual = sig; }
}

/** Lleva `elemento` a tener exactamente el HTML `html`, tocando lo mínimo. */
function morph(elemento, html) {
  const molde = document.createElement("template");
  molde.innerHTML = html;

// ───── jornada real: se guarda en ESTE dispositivo (sin servidor) ─────
// Por defecto /club es la demo. La jornada real se activa a propósito (Ajustes, con PIN de dueño, o /club?modo=real):
// arranca en blanco, se guarda sola en el navegador, vuelve bloqueada al recargar y usa el reloj real.
const CLAVE_JORNADA = "bp-jornada-v1", CLAVE_MODO = "bp-modo", CLAVE_CONTACTOS = "bp-contactos";
// Lo que ocupa cada copia vieja de la jornada (clave → caracteres): leerlas enteras en cada pantalla es caro (pueden
// pesar 3.000 KB). Se recalcula al abrir Configuración y cuando esta pestaña escribe o borra una copia.
const tamCopias = new Map();
const lsLeer = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const lsGuardar = (k, v) => {
  if (k.startsWith(`${CLAVE_JORNADA}-`)) tamCopias.delete(k);
  try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); return true; } catch { return false; }
};
// En el sitio del club (<meta name="bp-ambiente" content="real">) /club ES la gestión real; la demo para prospectos
// queda con ?demo=1 (sólo esa visita, no cambia nada guardado). Fuera del sitio (vista previa), demo salvo ?modo=real.
const Q = new URLSearchParams(location.search);
const AMBIENTE_REAL = document.querySelector('meta[name="bp-ambiente"]')?.content === "real";
// El celular del dueño que abre un link de aprobación (#aprobar&…) sin jornada guardada sólo calcula el código:
// no se convierte en una compu del club (no arma consola ni guarda nada).
const SOLO_APROBAR = location.hash.startsWith("#aprobar&") && !lsLeer(CLAVE_JORNADA) && lsLeer(CLAVE_MODO) !== "real";
const MODO_REAL = !SOLO_APROBAR && Q.get("demo") !== "1" && (Q.get("modo") === "real" || lsLeer(CLAVE_MODO) === "real" || (AMBIENTE_REAL && lsLeer(CLAVE_MODO) !== "demo"));
if (MODO_REAL) lsGuardar(CLAVE_MODO, "real"); // la compu queda en jornada real (se vuelve a la demo desde Configuración)
const guardado = { habilitado: false, cuando: null, ok: true, bytes: 0, timer: null, fuera: false, avisado: false, lleno: false, avisoLleno: false };
// El navegador guarda ~5 millones de caracteres por sitio. Pasados ~2,5 millones (3–4 semanas de club lleno) se avisa
// para archivar los días cerrados; nunca se archiva solo: el dueño se tiene que quedar con el archivo.
const AVISO_LLENO = 2_500_000;
// Los celulares de la jornada real no los ve ni los pisa la demo (que entra con un PIN de ejemplo): clave aparte.
const claveContactos = () => (MODO_REAL ? CLAVE_CONTACTOS : `${CLAVE_CONTACTOS}-demo`);
const contactos = () => { try { return JSON.parse(lsLeer(claveContactos()) || "{}") ?? {}; } catch { return {}; } };
const waA = (quien, texto) => M.linkWhatsApp(contactos()[quien] ?? "", texto);

function leerJornada() {
  try { return JSON.parse(lsLeer(CLAVE_JORNADA) || "null"); } catch { return null; }
}
function fotoJornada() {
  return JSON.stringify({ ...M.serializarEstado(E), usuario: USUARIO, guardado: Date.now() });
}
function guardarJornada(inmediato = false) {
  if (!MODO_REAL || !E || !guardado.habilitado || guardado.fuera) return;
  clearTimeout(guardado.timer);
  const hacer = () => {
    let txt = fotoJornada();
    let ok = lsGuardar(CLAVE_JORNADA, txt);
    if (!ok) {
      // Falta lugar: se recorta la historia vieja (el registro) y se vuelve a probar.
      E.log.length = Math.min(E.log.length, 60);
      txt = fotoJornada();
      ok = lsGuardar(CLAVE_JORNADA, txt);
    }
    guardado.ok = ok;
    if (ok) { guardado.cuando = new Date(); guardado.bytes = txt.length; guardado.avisado = false; }
    else if (!guardado.avisado) { guardado.avisado = true; toast("No se pudo guardar en esta compu: falta lugar. Descargá un respaldo ya y archivá los días cerrados (Configuración → Jornada real).", { error: true }); }
    guardado.lleno = !ok || txt.length > AVISO_LLENO;
    if (ok && guardado.lleno && !guardado.avisoLleno) { guardado.avisoLleno = true; toast("Lo guardado en esta compu se está llenando: un dueño tiene que archivar los días cerrados (Configuración → Jornada real)."); }
    pintarGuardado();
  };
  if (inmediato) hacer(); else guardado.timer = setTimeout(hacer, 300);
}
function pintarGuardado() {
  const el = $("#guardado");
  if (!el) return;
  el.textContent = !guardado.ok ? "⚠ no se pudo guardar" : guardado.cuando ? `guardado ${pad(guardado.cuando.getHours())}:${pad(guardado.cuando.getMinutes())}` : "guardando…";
  el.classList.toggle("err", !guardado.ok);
  const aviso = $("#aviso-lleno");
  if (aviso) aviso.hidden = !guardado.lleno;
}
function descargarArchivo(texto, nombre) {
  const url = URL.createObjectURL(new Blob([texto], { type: "application/json" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: nombre });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function descargarRespaldo() {
  guardarJornada(true);
  const d = new Date();
  const nombre = `breakpoint-jornada-${hoyLocal()}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  descargarArchivo(fotoJornada(), nombre);
  toast(`Respaldo descargado: ${nombre}. Guardalo (o mandátelo por WhatsApp).`);
}
/**
 * Las copias que dejan la limpieza del go-live («-antes-golive»), «Empezar otra jornada en blanco» («-anterior») y una
 * jornada que no se pudo leer («-ilegible-…»): ocupan lugar en la misma compu. Se borran sólo si un dueño lo confirma.
 */
function copiasEnLaCompu() {
  const out = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const clave = localStorage.key(i);
      if (!clave?.startsWith(`${CLAVE_JORNADA}-`)) continue;
      const sufijo = clave.slice(CLAVE_JORNADA.length + 1);
      const nombre = sufijo === "antes-golive" ? "Copia de antes de la limpieza del go-live" : sufijo === "anterior" ? "Jornada anterior (la de antes de «Empezar otra jornada en blanco»)" : sufijo.startsWith("ilegible-") ? "Jornada que no se pudo leer" : `Copia «${sufijo}»`;
      if (!tamCopias.has(clave)) tamCopias.set(clave, (localStorage.getItem(clave) ?? "").length);
      out.push({ clave, sufijo, nombre, largo: tamCopias.get(clave) });
    }
  } catch { /* sin acceso al almacenamiento: no hay copias para mostrar */ }
  return out.sort((a, b) => a.clave.localeCompare(b.clave));
}
const kb = (largo) => `${Math.max(1, Math.ceil(largo / 1024)).toLocaleString("es-AR")} KB`;

/**
 * Reloj real del club. De madrugada (antes del cierre de ayer, ej. 00:30 con cierre a la 01:00) sigue siendo el
 * día que abrió: la agenda muestra esos turnos como «01:00» del día anterior, igual que el motor.
 */
function relojReal() {
  const d = new Date();
  const f = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const m = d.getHours() * 60 + d.getMinutes();
  const ayer = M.sumarDias(f, -1);
  if (E && m + 1440 < M.horarioDe(E, ayer).cierra) return { fecha: ayer, min: m + 1440 };
  return { fecha: f, min: m };
}
function latirReloj() {
  if (!MODO_REAL || !E || guardado.fuera) return;
  const t = relojReal();
  if (t.fecha === AHORA.fecha && t.min === AHORA.min) return;
  const viejo = HOY;
  AHORA = t;
  if (t.fecha !== viejo) {
    HOY = t.fecha;
    if (VISTA === viejo) VISTA = HOY;
    for (let d = 1; d <= 6; d++) M.materializarFijos(E, M.sumarDias(HOY, d));
    render();
    return toast(`Cambió el día: la agenda pasó al ${ddmm(HOY)}.`);
  }
  render();
}

function iniciar() {
  HOY = hoyLocal();
  if (MODO_REAL) {
    const foto = leerJornada();
    const h = foto ? M.hidratarEstado(foto) : null;
    E = h?.ok ? h.estado : M.crearClubReal(HOY);
    USUARIO = foto?.usuario && M.usuario(E, foto.usuario)?.activo !== false ? foto.usuario : E.usuarios.find((u) => u.activo !== false)?.id;
    AHORA = relojReal();
    HOY = AHORA.fecha;
    if (foto && !h.ok) lsGuardar(`${CLAVE_JORNADA}-ilegible-${Date.now()}`, lsLeer(CLAVE_JORNADA));
    if (foto && !h.ok) requestAnimationFrame(() => toast(`Lo guardado en esta compu no se pudo leer (${h.motivo}): arrancó en blanco (lo guardado quedó apartado en esta compu, no se borró). Si tenés un respaldo, restauralo desde Configuración.`, { error: true }));
  } else {
    E = M.generarDemo(HOY);
    AHORA = { fecha: HOY, min: 19 * 60 + 10 };
    USUARIO = "u-lu";
  }
  VISTA = HOY;
  TAB = "agenda";
  ui.mes = HOY.slice(0, 7);
  ui.busca = {};
  ui.producto = {};
  ui.remito = null;
  for (let d = 1; d <= 6; d++) M.materializarFijos(E, M.sumarDias(HOY, d));
  render();
  // Los PIN que estaban en claro (jornada de antes del 21/10) pasan a hash y se guardan ya, una sola vez.
  if (MODO_REAL && M.pasarPinesAHash(E)) guardarJornada(true);
}

// Un solo aviso a la vez. Los errores van al lado de lo que falló (dentro de la ventana abierta);
// lo que salió bien se confirma abajo a la derecha y, si se puede, con «Deshacer».
function toast(texto, { error = false, deshacer = null } = {}) {
  UNDO = deshacer;
  const boton = deshacer ? ` <button type="button" data-a="deshacer">Deshacer</button>` : "";
  const dlg = $("#dlg");
  if (dlg.open) {
    const aviso = $("#dlg-aviso", dlg);
    if (aviso) {
      aviso.innerHTML = `${esc(texto)}${boton}`;
      aviso.className = error ? "err" : "small";
      aviso.setAttribute("role", error ? "alert" : "status");
      return;
    }
  }
  const t = document.createElement("div");
  t.className = `toast${error ? " err" : ""}`;
  if (error) t.setAttribute("role", "alert");
  t.innerHTML = `<span>${esc(texto)}</span>${boton}`;
  $("#toasts").replaceChildren(t);
  clearTimeout(timerToast);
  timerToast = setTimeout(() => { t.remove(); if (UNDO === deshacer) UNDO = null; }, deshacer ? 6000 : error ? 4000 : 2500);
}

function claveFoco() {
  const a = document.activeElement;
  if (!a || a === document.body) return null;
  if (a.id) return `#${CSS.escape(a.id)}`;
  if (a.dataset?.a) return `[data-a="${CSS.escape(a.dataset.a)}"]${["v", "c", "m", "j"].map((k) => (a.dataset[k] != null ? `[data-${k}="${CSS.escape(a.dataset[k])}"]` : "")).join("")}`;
  return null;
}
function devolverFoco(clave, raiz = document) {
  if (!clave) return;
  const el = raiz.querySelector(clave);
  if (el && typeof el.focus === "function") el.focus({ preventScroll: true });
}

}

function grilla() {
  const { paso } = E.config;
  const { abre, cierra } = M.horarioDe(E, VISTA);
  const filas = (cierra - abre) / paso;
  const top = (m) => ((m - abre) / paso) * ROW;
  const delDia = E.reservas.filter((r) => r.fecha === VISTA && ["reservada", "en_cancha", "finalizada"].includes(r.estado));
  const conAlerta = VISTA === HOY ? new Set(ALERTAS.filter((a) => a.nivel === "alta" && a.reservaId).map((a) => a.reservaId)) : new Set();
  // Un hueco ya empezado se puede cargar mientras un turno ahí no terminaría (recepción se olvidó de cargarlo).
  const pasado = (m) => M.minutosHasta(AHORA, VISTA, m) + E.config.duracionTurno <= 0;
  const n = E.canchas.length;
  const cabecera = `<div class="gh" style="grid-column:1;grid-row:1"><span class="tag">Hora</span></div>` + E.canchas.map((c, i) => `
    <div class="gh" style="grid-column:${i + 2};grid-row:1">
      <div><div class="n">${esc(c.nombre)}</div><div class="tag">${[techoMixto() ? (c.cubierta ? "Techada" : "Descubierta") : "", c.estado === "mantenimiento" ? `<b class="rojo">en mantenimiento</b>` : ""].filter(Boolean).join(" · ")}</div></div>
      <button type="button" class="luz" data-a="luz" data-v="${c.id}" aria-pressed="${!!E.luces[c.id]}" aria-label="Luz de ${esc(c.nombre)}: ${E.luces[c.id] ? "prendida, tocar para apagar" : "apagada, tocar para prender"}">💡</button>
    </div>`).join("");
  let horas = "";
  for (let m = abre; m < cierra; m += 60) horas += `<span class="num" style="top:${top(m) + 8}px">${M.hhmm(m)}</span>`;
  const columnaHora = `<div class="tcol" style="grid-column:1;grid-row:2;height:${filas * ROW}px">${horas}</div>`;
  const columnas = E.canchas.map((c, idx) => {
    let slots = "";
    for (let i = 0; i < filas; i++) {
      const m = abre + i * paso;
      slots += pasado(m)
        ? `<div class="slot pasado ${m % 60 === 0 ? "hora" : ""}" style="top:${i * ROW}px" aria-hidden="true"></div>`
        : `<button type="button" class="slot ${m % 60 === 0 ? "hora" : ""}" style="top:${i * ROW}px" data-a="nuevo" data-c="${c.id}" data-m="${m}" aria-label="${esc(c.nombre)}, ${M.hhmm(m)}, libre. Reservar">+ ${M.hhmm(m)}</button>`;
    }
    const turnos = delDia.filter((r) => r.canchaId === c.id).map((r) => {
      const hgt = (r.duracion / paso) * ROW - 3;
      const senal = senalReserva(r);
      const titular = r.clienteId ? M.cliente(E, r.clienteId) : null;
      const extra = r.tipo === "clase" || r.tipo === "abierto" ? ` · ${M.TIPOS[r.tipo].toLowerCase()}` : "";
      return `<button type="button" class="blk ${r.estado} ${r.tipo} ${conAlerta.has(r.id) ? "alerta" : ""}" style="top:${top(r.inicio) + 1}px;height:${hgt}px" data-a="ver" data-v="${r.id}" data-k="r-${r.id}" aria-haspopup="dialog" aria-label="${esc(r.titular)}${r.tipo === "fijo" ? ", turno fijo" : ""}, ${M.hhmm(r.inicio)} a ${M.hhmm(r.inicio + r.duracion)}, ${M.ESTADOS[r.estado]}, cancha debe ${M.pesos(M.saldo(r))}${titular?.deuda > 0 ? `, tiene saldo deudor de ${M.pesos(titular.deuda)}` : ""}${r.notas ? ", tiene nota" : ""}. Clic derecho o mantener apretado: acciones rápidas">
        <span class="tt">${titular?.deuda > 0 ? `<span class="alerta-pago" title="Saldo deudor"></span>` : ""}${esc(r.titular)}${r.notas ? `<span class="dot" title="Tiene nota"></span>` : ""}</span>
        <span class="meta num">${M.hhmm(r.inicio)}–${M.hhmm(r.inicio + r.duracion)} · ${r.jugadores.length}/4${extra}</span>
        ${senal && hgt > 44 ? `<span class="debe num">${senal}</span>` : ""}
      </button>`;
    }).join("");
    const bloqueos = E.bloqueos.filter((b) => b.fecha === VISTA && (b.canchaId === c.id || b.canchaId === "*")).map((b) =>
      `<div class="blk bloqueo" style="top:${top(b.desde) + 1}px;height:${((b.hasta - b.desde) / paso) * ROW - 3}px"><span class="tt">Bloqueada</span><span class="meta">${esc(b.motivo)}</span></div>`).join("");
    return `<div class="ccol ${c.estado === "mantenimiento" ? "mant" : ""}" style="grid-column:${idx + 2};grid-row:2;height:${filas * ROW}px">${slots}${bloqueos}${turnos}</div>`;
  }).join("");
  const ahoraLinea = VISTA === HOY && AHORA.min >= abre && AHORA.min <= cierra
    ? `<div style="grid-column:2 / -1;grid-row:2;position:relative;pointer-events:none;z-index:4" aria-hidden="true"><div class="now" style="top:${top(AHORA.min)}px" data-h="${M.hhmm(AHORA.min)}"></div></div>` : "";
  return `<div class="grid-wrap" id="grid-wrap" data-vista="${VISTA}"><div class="grilla" style="grid-template-columns:56px repeat(${n},minmax(140px,1fr))" role="group" aria-label="Grilla de turnos por cancha">${cabecera}${columnaHora}${columnas}${ahoraLinea}</div></div>`;
}

        ${kpi("Ocupación de hoy", pct(k.ocupacion), `Pico ${pct(k.ocupacionPico)} · valle ${pct(k.ocupacionValle)}`)}
        ${kpi("Canchas vendidas hoy", M.pesos(k.vendido), `${k.turnos} turnos · ticket ${M.pesos(k.ticketPromedio)}`)}
        ${kpi("Cobrado de canchas", M.pesos(k.cobrado), `Por cobrar de lo que ya se juega: ${M.pesos(k.porCobrar)}`)}
        ${kpi("Buffet del día", M.pesos(k.buffet), `${k.cuentasAbiertas} cuentas abiertas · ${M.pesos(k.cuentasAbiertasSaldo)}`)}
        ${kpi("Cuentas corrientes", M.pesos(k.deudaClientes), `Créditos emitidos ${M.pesos(k.creditos)}`)}
        ${kpi("Le debemos a proveedores", M.pesos(k.deudaProveedores), "Ver Proveedores")}
        ${kpi("Stock valorizado", M.pesos(k.stockValorizado), `Faltas hoy: ${k.faltas}`)}

    </section>

      ${MODO_REAL ? "" : `<section class="card span-8" aria-labelledby="t-cams">
        <div class="card-head"><h2 id="t-cams">Cámaras</h2><span class="muted small">Cada cámara muestra el turno que está en esa cancha y lo que debe</span></div>
        <div class="cams">${camaras.tiles()}</div>
        <p class="honesto">Simulación de demo. En el club se conecta la grabadora (NVR) que ya tienen: cada cámara se asocia a su cancha y se ve en vivo desde acá, sin abrir otra app.</p>
      </section>`}
      <section class="card span-4" aria-labelledby="t-torre">
        <div class="card-head"><h2 id="t-torre">Canchas ahora</h2><span class="muted small num">${M.hhmm(AHORA.min)}</span></div>
        <div class="torre">${enCancha.map(({ c, r, prox }) => {
          const p = r ? Math.min(1, Math.max(0, (AHORA.min - r.inicio) / r.duracion)) : 0;
          return `<div class="t"><b>${esc(c.nombre)}</b><div>${r ? `<div class="small"><b>${esc(r.titular)}</b> · termina ${M.hhmm(r.inicio + r.duracion)}</div><div class="bar" role="img" aria-label="Jugado ${Math.round(p * 100)}%"><i style="width:${p * 100}%"></i></div>` : `<div class="small muted">${c.estado === "mantenimiento" ? "En mantenimiento" : "Libre"}${prox ? ` · próximo ${M.hhmm(prox.inicio)} ${esc(prox.titular)}` : ""}</div>`}</div>${r ? (M.saldo(r) > 0 ? `<span class="chip warn">Debe ${M.pesos(M.saldo(r))}</span>` : `<span class="chip ok">Paga</span>`) : E.luces[c.id] ? `<span class="chip bad">Luz prendida</span>` : `<span class="chip">—</span>`}</div>`;

      ${FOTOS.length ? `<section class="card span-12 cv" aria-labelledby="t-redes">
        <div class="card-head"><h2 id="t-redes">El club en redes</h2><a class="btn sm ghost" href="https://www.instagram.com/breakpointpadel_/" target="_blank" rel="noopener">Ver Instagram</a></div>
        <div class="redes">${FOTOS.map((f) => `<figure><img src="${f.src}" width="${f.w}" height="${f.h}" alt="${esc(f.texto)}" loading="lazy" decoding="async"><figcaption>${esc(f.texto)}<small>${esc(f.fuente)}</small></figcaption></figure>`).join("")}</div>
        <p class="small muted" style="margin:10px 0 0">Tomadas de Instagram en baja resolución. Con las fotos originales del club (canchas, Delicias, shop) se arma la galería definitiva.</p>

      <section class="card span-7" aria-labelledby="t-calor">

      <section class="card span-5" aria-labelledby="t-plata">
        <div class="card-head"><h2 id="t-plata">Caja del día por medio</h2><span class="muted small num">Neto ${M.pesos(k.caja.neto)}</span></div>
        <div class="medios num">${Object.entries(k.caja.porMedio).map(([m, v]) => `<div class="m"><span>${M.MEDIOS[m]}</span><div class="bar" role="img" aria-label="${M.MEDIOS[m]}: ${M.pesos(v)}"><i style="width:${(Math.max(0, v) / maxMedio) * 100}%"></i></div><b style="text-align:right">${M.pesos(v)}</b></div>`).join("")}</div>

        <div class="card-head"><h2 id="t-platos">Venta de platos · últimos 7 días</h2><span class="muted small num">Total ${M.pesos(platos.total)} · ${platos.dias} días</span></div>
        <div class="tbl-wrap"><table class="num"><thead><tr><th>Plato</th><th class="r">Unidades</th><th class="r">Por día</th><th class="r">Facturado</th><th class="r">Margen</th><th>Participación</th></tr></thead><tbody>
          ${platos.filas.map((f) => `<tr><td>${esc(f.plato)}</td><td class="r">${f.unidades}</td><td class="r">${f.porDia.toFixed(1)}</td><td class="r">${M.pesos(f.facturado)}</td><td class="r">${M.pesos(f.margen)}</td><td style="min-width:140px"><div class="bar" role="img" aria-label="${Math.round(f.participacion * 100)}%"><i style="width:${f.participacion * 100}%"></i></div></td></tr>`).join("") || `<tr><td colspan="6" class="muted">Todavía no hay ventas de cocina.</td></tr>`}

}

const kpi = (l, v, s) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;

function mapaCalor({ horas, filas }) {
  const color = (v) => `color-mix(in oklab, var(--royal) ${Math.round(8 + v * 92)}%, var(--paper))`;
  const cols = `grid-template-columns:64px repeat(${horas.length},minmax(14px,1fr))`;
  return `<div class="tbl-wrap"><div class="heat" style="${cols};min-width:520px" role="img" aria-label="Mapa de ocupación de los últimos 7 días por hora. Detalle en la tabla de abajo.">
    <span></span>${horas.map((h) => `<span class="lab num" style="justify-content:center">${(h / 60) % 24}</span>`).join("")}
    ${filas.map((f) => `<span class="lab">${esc(fechaCorta(f.fecha))}</span>${f.valores.map((v, i) => `<span class="c" style="background:${color(v)}" title="${esc(fechaCorta(f.fecha))} ${M.hhmm(horas[i])}: ${Math.round(v * 100)}% ocupado"></span>`).join("")}`).join("")}
  </div></div>
  <div class="heat-scale" aria-hidden="true">Vacío <i style="background:${color(0)}"></i><i style="background:${color(0.33)}"></i><i style="background:${color(0.66)}"></i><i style="background:${color(1)}"></i> Lleno</div>
  <details style="margin-top:8px"><summary class="small muted">Ver como tabla</summary><div class="tbl-wrap"><table class="num small"><thead><tr><th>Día</th>${horas.map((h) => `<th class="r">${M.hhmm(h)}</th>`).join("")}</tr></thead><tbody>${filas.map((f) => `<tr><td>${esc(fechaCorta(f.fecha))}</td>${f.valores.map((v) => `<td class="r">${Math.round(v * 100)}%</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>`;
}

// ───────────────────────────── Stock (dueño) ─────────────────────────────

// Pricing y revenue: la misma lista, para tocar costo, markup y precio y ver qué deja cada producto.
function tablaPrecios(lista) {
  const desde = M.sumarDias(HOY, -6);
  const rent = M.rentabilidad(E, { desde, hasta: HOY });
  const fila = new Map(rent.filas.map((f) => [f.productoId, f]));
  const pct = (x) => (x == null ? "—" : `${Math.round(x * 100)}%`);
  const filas = lista.map((p) => fila.get(p.id)).filter(Boolean);
  return `<p class="small muted" style="margin:0 0 10px">Tocá el costo, el % sobre costo o el precio: el precio de venta cambia en el acto para lo que se cargue de acá en más. Lo vendido es de los últimos 7 días (${ddmm(desde)} al ${ddmm(HOY)}).</p>
    <div class="tbl-wrap"><table class="num precios"><thead><tr><th>Producto</th><th class="r">Costo</th><th class="r">% sobre costo</th><th class="r">Precio</th><th class="r">Margen</th><th class="r">Margen %</th><th class="r">Vendidos</th><th class="r">Facturado</th><th class="r">Ganancia</th></tr></thead><tbody>
      ${filas.map((f) => `<tr><td>${esc(f.nombre)}<br><span class="small muted">${esc(f.codigo || "—")}${f.codigoExterno ? ` · ${esc(f.codigoExterno)}` : ""}</span></td>
        <td class="r"><label class="sr" for="px-c-${f.productoId}">Costo de ${esc(f.nombre)}</label><input id="px-c-${f.productoId}" type="number" min="0" step="50" value="${f.costo}" data-a="px" data-v="${f.productoId}" data-c="costo"></td>
        <td class="r"><label class="sr" for="px-m-${f.productoId}">Porcentaje sobre el costo de ${esc(f.nombre)}</label><input id="px-m-${f.productoId}" type="number" step="5" value="${f.markupPct == null ? "" : Math.round(f.markupPct * 100)}" placeholder="—" data-a="px" data-v="${f.productoId}" data-c="markup" ${f.costo > 0 ? "" : "disabled"}></td>
        <td class="r"><label class="sr" for="px-p-${f.productoId}">Precio de ${esc(f.nombre)}</label><input id="px-p-${f.productoId}" type="number" min="1" step="50" value="${f.precio}" data-a="px" data-v="${f.productoId}" data-c="precio"></td>
        <td class="r">${M.pesos(f.margen)}</td><td class="r"><span class="chip ${f.margenPct >= 0.5 ? "ok" : f.margenPct >= 0.3 ? "warn" : "bad"}">${pct(f.margenPct)}</span></td>
        <td class="r">${f.unidades}</td><td class="r">${M.pesos(f.facturado)}</td><td class="r">${M.pesos(f.ganancia)}</td></tr>`).join("") || `<tr><td colspan="9" class="muted">No hay productos con ese nombre.</td></tr>`}
    </tbody><tfoot><tr><td colspan="7"><b>Total 7 días</b> · margen ${pct(rent.margenPct)}</td><td class="r"><b>${M.pesos(rent.facturado)}</b></td><td class="r"><b>${M.pesos(rent.ganancia)}</b></td></tr></tfoot></table></div>`;
}

function vistaStock() {
  const q = ui.busca.stock ?? "";
  const precios = ui.stockModo === "precios";
  const lista = M.buscarProductos(E, q);
  const bajos = E.productos.filter((p) => p.activo !== false && !p.alquiler && p.stock != null && p.stock <= p.minimo);
  return `<section class="card" aria-labelledby="t-stock">
    <div class="card-head"><h2 id="t-stock" class="pantalla">Stock y productos</h2>
      <div class="row">${bajos.length ? `<a class="btn sm accent" target="_blank" rel="noopener" href="${esc(wa(M.mensajeWhatsApp("reposicion", { lista: bajos.map((p) => `${p.nombre} (${Math.max(p.minimo * 2 - p.stock, 1)})`).join(", ") })))}">Pedir lo que falta por WhatsApp</a>` : ""}<button type="button" class="btn" data-a="remito">Ingresar por remito</button><button type="button" class="btn primary" data-a="altaProducto">+ Producto o plato</button></div></div>
    <div class="row" style="margin-bottom:10px;justify-content:space-between">
      <div class="search" style="max-width:360px;flex:1"><label class="sr" for="busca-stock">Buscar producto</label><input id="busca-stock" data-busca="stock" placeholder="Nombre, rubro o código" value="${esc(q)}"></div>
      <div class="medio-pick" role="group" aria-label="Qué ver"><button type="button" data-a="stockModo" data-v="inventario" aria-pressed="${!precios}">Inventario</button><button type="button" data-a="stockModo" data-v="precios" aria-pressed="${precios}">Precios y rentabilidad</button></div>
    </div>
    ${precios ? tablaPrecios(lista) : `<div class="tbl-wrap"><table class="num"><thead><tr><th>Producto</th><th>Rubro</th><th>Cód. interno</th><th>Cód. fábrica</th><th class="r">Precio</th><th class="r">Costo</th><th class="r">Stock</th><th class="r">Mínimo</th><th>Estado</th><th></th></tr></thead><tbody>
      ${lista.map((p) => `<tr><td>${esc(p.nombre)}</td><td>${esc(p.categoria)}</td><td class="small">${esc(p.codigo || "—")}</td><td class="small">${esc(p.codigoExterno || "—")}</td><td class="r">${M.pesos(p.precio)}</td><td class="r">${M.pesos(p.costo)}</td>
        <td class="r">${p.stock == null ? "—" : p.stock}${p.alquiler ? ` <span class="muted small">(${p.prestados ?? 0} en uso)</span>` : ""}</td><td class="r">${p.stock == null || p.alquiler ? "—" : p.minimo}</td>
        <td>${p.plato ? `<span class="chip info">Plato</span>` : p.alquiler ? `<span class="chip info">Alquiler</span>` : p.stock === 0 ? `<span class="chip bad">Sin stock</span>` : p.stock <= p.minimo ? `<span class="chip warn">Reponer</span>` : `<span class="chip ok">OK</span>`}</td>
        <td><button type="button" class="btn sm" data-a="editarProducto" data-v="${p.id}">Editar</button></td></tr>`).join("") || `<tr><td colspan="10" class="muted">No hay productos con ese nombre.</td></tr>`}
    </tbody></table></div>`}
  </section>`;
}

// ───────────────────────────── Contenido (dueño) ─────────────────────────────

function vistaContenido() {
  const [anio, mes] = ui.mes.split("-").map(Number);
  const offset = (M.diaSemana(`${ui.mes}-01`) + 6) % 7; // la semana arranca el lunes
  const diasMes = new Date(Date.UTC(anio, mes, 0)).getUTCDate();
  const pubs = M.contenidoDelMes(E, anio, mes);
  const nombreMes = new Date(Date.UTC(anio, mes - 1, 1)).toLocaleDateString("es-AR", { month: "long", year: "numeric", timeZone: "UTC" });
  let celdas = "";
  for (let i = 0; i < offset; i++) celdas += `<div class="dia fuera" aria-hidden="true"></div>`;
  for (let d = 1; d <= diasMes; d++) {
    const f = `${ui.mes}-${pad(d)}`;
    const delDia = pubs.filter((p) => p.fecha === f);
    celdas += `<div class="dia ${f === HOY ? "hoy" : ""}"><div class="n"><span>${d}</span><button type="button" data-a="nuevoContenido" data-v="${f}" aria-label="Agregar publicación el ${d}">+</button></div>
      ${delDia.map((p) => `<button type="button" class="pub ${p.estado}" data-a="verContenido" data-v="${p.id}" title="${esc(M.CANALES[p.canal])} · ${esc(M.ESTADOS_CONTENIDO[p.estado])}">${esc(p.hora)} <span class="t">${esc(p.titulo)}</span></button>`).join("")}
    </div>`;
  }
  const porEstado = Object.keys(M.ESTADOS_CONTENIDO).map((k) => `${M.ESTADOS_CONTENIDO[k]}: ${pubs.filter((p) => p.estado === k).length}`).join(" · ");
  return `<div class="stack">${seccionDifusion()}<section class="card" aria-labelledby="t-cont">
    <div class="card-head"><h2 id="t-cont" class="pantalla">Contenido · ${esc(nombreMes)}</h2>
      <div class="row"><button type="button" class="btn sm" data-a="mes" data-v="-1" aria-label="Mes anterior">‹</button><button type="button" class="btn sm" data-a="mes" data-v="0">Hoy</button><button type="button" class="btn sm" data-a="mes" data-v="1" aria-label="Mes siguiente">›</button><button type="button" class="btn primary" data-a="nuevoContenido" data-v="${HOY}">+ Publicación</button></div></div>
    <p class="small muted" style="margin:0 0 8px">Calendario de redes y WhatsApp del club. ${porEstado}</p>
    <div class="tbl-wrap"><div class="cal" style="min-width:560px">${["lun", "mar", "mié", "jue", "vie", "sáb", "dom"].map((d) => `<div class="dow">${d}</div>`).join("")}${celdas}</div></div>
    <div class="legend"><span><i style="background:var(--cream)"></i>Idea</span><span><i style="background:var(--royal-soft)"></i>Programado</span><span><i style="background:var(--ok-soft)"></i>Publicado</span></div>
    <div class="row" style="margin-top:10px"><button type="button" class="btn" data-a="studio">Abrir el Studio de redes (imágenes y textos)</button></div>
  </section></div>`;
}

// Novedades del club por difusión: se arma acá y se manda desde el WhatsApp del club. Sin API de WhatsApp no hay
// envío masivo automático: o se pega en una lista de difusión de WhatsApp Business, o se manda uno por uno.
function seccionDifusion() {
  const d = ui.difusion ?? { tipo: "novedad", titulo: "", texto: "", audiencia: "todos" };
  const cuantos = M.destinatarios(E, d.audiencia, AHORA).length;
  const ultima = (E.difusiones ?? [])[0];
  const enviando = ui.difusionId ? (E.difusiones ?? []).find((x) => x.id === ui.difusionId) : null;
  return `<section class="card" aria-labelledby="t-dif">
    <div class="card-head"><h2 id="t-dif" class="pantalla">Novedades del club · difusión por WhatsApp</h2></div>
    <div class="grid2">
      <label class="f">Tipo<select id="df-tipo" data-dif="tipo">${Object.entries(M.TIPOS_NOVEDAD).map(([k, v]) => `<option value="${k}" ${d.tipo === k ? "selected" : ""}>${v}</option>`).join("")}</select></label>
      <label class="f">A quiénes<select id="df-aud" data-dif="audiencia">${Object.entries(M.AUDIENCIAS).map(([k, v]) => `<option value="${k}" ${d.audiencia === k ? "selected" : ""}>${v}</option>`).join("")}</select></label>
      <label class="f" style="grid-column:1/-1">Título<input id="df-titulo" data-dif="titulo" maxlength="80" value="${esc(d.titulo)}" placeholder="Ej.: Torneo de categorías el sábado 25"></label>
      <label class="f" style="grid-column:1/-1">Texto<textarea id="df-texto" data-dif="texto" rows="4" maxlength="900" placeholder="Qué, cuándo, cuánto sale y cómo anotarse.">${esc(d.texto)}</textarea></label>
    </div>
    <p class="small muted" style="margin:6px 0">Le llega a <b>${cuantos}</b> cliente(s) con celular que no pidieron la baja. Así se ve:</p>
    <div class="wa">${esc(M.mensajeDifusion(d, "Juan")).replace(/\n/g, "<br>")}</div>
    <div class="row" style="margin-top:8px"><button type="button" class="btn primary" data-a="armarDifusion" ${cuantos ? "" : "disabled"}>Preparar el envío</button><button type="button" class="btn" data-a="studioNovedad">Hacer la imagen en el Studio</button></div>
    ${enviando ? listaEnvio(enviando) : ultima ? `<p class="small muted" style="margin:8px 0 0">Última: «${esc(ultima.titulo)}» · ${ultima.enviados.length} de ${ultima.destinatarios.length} enviados. <button type="button" class="btn sm ghost" data-a="verDifusion" data-v="${ultima.id}">Seguir mandando</button></p>` : ""}
  </section>`;
}
function listaEnvio(d) {
  const lista = d.destinatarios.map((id) => M.cliente(E, id)).filter(Boolean);

// ───────────────────────────── Consola de configuración (primer arranque de la jornada real) ─────────────────────────────

const enConsola = () => MODO_REAL && E?.config?.configurado === false;
// En la consola firma el dueño que ya armó su PIN; si sólo hay uno con el PIN viejo de 2 (una consola del piloto que
// quedó sin abrir), el motor no lo deja firmar y avisa: se abre el club, se entra con el viejo y se elige el de 4.
// El PIN que cada dueño armó en la consola, en memoria mientras dura la pantalla: con el PIN guardado con hash
// (21/10) la consola ya no puede firmar con lo guardado. Si se recarga a mitad de la consola, vale lo guardado en claro
// (fotos de antes) o hay que volver a escribirlo.
const PIN_DE_CONSOLA = new Map();
const authDeConsola = (dueno) => ({ usuarioId: dueno.id, pin: PIN_DE_CONSOLA.get(dueno.id) ?? (M.esPinConHash(dueno.pin) ? "" : dueno.pin) });
const duenoDeConsola = () => E.usuarios.find((u) => u.rol === "duenio" && u.pin && !M.pinDesactualizado(E, u.id)) ?? E.usuarios.find((u) => u.rol === "duenio" && u.pin);

// Los dueños arman su PIN, se cargan los avisos y se da de alta a recepción. Recién ahí se abre el club.
function vistaConsola() {
  const duenios = E.usuarios.filter((u) => u.rol === "duenio" && u.activo !== false);

      <p style="margin:0">El club arranca vacío: sin turnos, clientes ni caja. Se guarda en <b>esta compu</b>. Completá esto una vez y queda listo para usar.</p>
    </section>
    <section class="card" aria-labelledby="t-c1">
      <div class="card-head"><h2 id="t-c1">1 · Los dueños arman su PIN</h2><span class="muted small">${listos} de ${duenios.length} listos</span></div>
      <p class="small muted" style="margin:0 0 8px">${M.LARGO_PIN.duenio} números que sólo sepa cada uno. Con ese PIN se entra, se desbloquea la pantalla y se autorizan créditos, descuentos y accesos.</p>
      <div class="reglas">${duenios.map((u) => u.pin
        ? `<p style="margin:0"><b>${esc(u.nombre)}</b> · ✔ PIN armado</p>`
        : `<div><p style="margin:0 0 4px"><b>${esc(u.nombre)}</b></p><div class="row"><label class="f" style="max-width:130px">PIN (${M.LARGO_PIN.duenio} números)<input id="pi-${u.id}" type="password" inputmode="numeric" autocomplete="off" maxlength="${M.LARGO_PIN.duenio}" placeholder="${puntos("duenio")}"></label><label class="f" style="max-width:130px">Repetilo<input id="pi2-${u.id}" type="password" inputmode="numeric" autocomplete="off" maxlength="${M.LARGO_PIN.duenio}" placeholder="${puntos("duenio")}"></label><button type="button" class="btn sm primary" data-a="pinInicial" data-v="${u.id}" style="align-self:flex-end">Guardar PIN</button></div></div>`).join("")}</div>
    </section>
    <section class="card" aria-labelledby="t-c2">
      <div class="card-head"><h2 id="t-c2">2 · Avisos por WhatsApp</h2><span class="muted small">Opcional · se guarda en esta compu</span></div>
      <div class="reglas">
        ${duenios.map((u) => `<label class="f">Celular de ${esc(u.nombre)} (le llegan los pedidos de crédito)<input type="tel" inputmode="tel" placeholder="549 11 …" value="${esc(k[u.id] ?? "")}" data-a="contacto" data-v="${u.id}"></label>`).join("")}
        <label class="f">WhatsApp del club (recepción)<input type="tel" inputmode="tel" placeholder="549 11 …" value="${esc(k.club ?? "")}" data-a="contacto" data-v="club"></label>
        <label class="f">Alias para la seña<input value="${esc(E.config.cobro?.alias ?? "")}" placeholder="alias.del.club" data-a="alias"></label>
      </div>
    </section>
    <section class="card" aria-labelledby="t-c3">
      <div class="card-head"><h2 id="t-c3">3 · Recepción</h2><span class="muted small">Opcional · también se hace después</span></div>
      ${usuariosRecepcion()}
      <div class="row"><label class="f" style="max-width:240px">Nombre<input id="nu-nombre" placeholder="Ej.: Lu (tarde)"></label><button type="button" class="btn sm" data-a="altaUsuarioConsola" style="align-self:flex-end">Dar de alta en recepción</button></div>
    </section>
    <section class="card" aria-labelledby="t-c4">
      <div class="card-head"><h2 id="t-c4">4 · Precios y caja</h2><span class="muted small">Revisalos antes del primer turno</span></div>
      <div class="reglas">
        ${E.config.tarifas.map((t, i) => `<label class="f">Precio por hora ${esc(t.nombre.toLowerCase())} (${M.hhmm(t.desde)}–${M.hhmm(t.hasta)})<input type="number" min="0" step="500" value="${t.precioHora}" data-a="tarifa" data-v="${i}"></label>`).join("")}
        <label class="f">Fondo de caja (cambio en el cajón)<input type="number" min="0" step="100" value="${E.caja.fondo}" data-a="fondo"></label>
      </div>
      <p class="small muted" style="margin:8px 0 0">Los precios del buffet y la tienda se revisan en Stock → «Precios y rentabilidad». El stock arranca sin controlar: cuando cuentes, cargalo en cada producto (Stock → Editar).</p>

      <button type="button" class="btn primary" data-a="terminarConsola" ${listos ? "" : "disabled"}>Abrir el club</button>

  </div>`;
}

function usuariosRecepcion() {
  const rec = E.usuarios.filter((u) => u.rol === "recepcion" && u.activo !== false);
  return rec.length ? `<ul class="small" style="margin:0 0 8px">${rec.map((u) => `<li><b>${esc(u.nombre)}</b>${ui.pinesNuevos?.[u.id] ? ` · PIN <b class="num">${esc(ui.pinesNuevos[u.id])}</b> (anotalo y dáselo: no se vuelve a mostrar)` : ""}</li>`).join("")}</ul>` : `<p class="small muted" style="margin:0 0 8px">Todavía no hay nadie en recepción.</p>`;
}

// ───────────────────────────── Ajustes (dueño) ─────────────────────────────

// El link del turnero para los clientes lleva el WhatsApp del club, las tarifas y la tienda (precios) que tiene ESTA
// compu: el celular del cliente no se conecta con la del club, así que lo que ve sale del link.
function linkParaClientes(k = contactos()) {
  const q = new URLSearchParams({ modo: "pedido" });
  if (k.club) q.set("wa", String(k.club).replace(/\D/g, ""));
  q.set("tar", E.config.tarifas.map((t) => `${t.desde}-${t.hasta}-${t.precioHora}`).join(","));
  const cat = E.productos.filter((p) => p.tienda && p.activo !== false && !p.alquiler && !p.plato && p.stock !== 0).map((p) => `${p.id}:${p.precio}`);
  if (cat.length) q.set("cat", cat.join(","));
  return `${location.origin}${location.pathname.replace(/\/club\/?$/, "")}/turnero?${q.toString()}`;
}

function tarjetaJornada() {
  const guardada = MODO_REAL ? null : leerJornada();
  const k = contactos();
  const linkClientes = linkParaClientes(k);
  return `<section class="card" aria-labelledby="t-jornada">

      ${MODO_REAL ? `<p class="small" style="margin:0 0 8px">Se guarda sola en <b>esta compu</b> (${guardado.ok ? (guardado.cuando ? `último guardado ${pad(guardado.cuando.getHours())}:${pad(guardado.cuando.getMinutes())} · ${Math.ceil(guardado.bytes / 1024)} KB` : "guardando…") : "⚠ no se pudo guardar"}). No pasa a otras compus ni celulares. Al recargar vuelve bloqueada y pide el PIN.</p>
        <ol class="small" style="margin:0 0 10px;padding-left:18px"><li>Antes de abrir: <b>PIN nuevo</b> para cada usuario (abajo). Los de ejemplo los conoce cualquiera.</li><li>Abrí sólo esta pestaña del club en esta compu.</li><li>Al cerrar el día: cerrá la caja y <b>descargá el respaldo</b>.</li></ol>
        <div class="row"><button type="button" class="btn primary" data-a="respaldo">Descargar respaldo</button>
          <label class="btn" for="restaurar">Restaurar desde un archivo</label><input id="restaurar" type="file" accept=".json,application/json" class="sr" data-a="restaurar">
          <button type="button" class="btn" data-a="jornada" data-v="demo">Volver a la demo</button>
          <button type="button" class="btn danger" data-a="jornada" data-v="blanco">Empezar otra jornada en blanco</button></div>
        <div class="seccion" style="margin-top:12px" aria-labelledby="t-golive"><h3 id="t-golive">Limpieza para el go-live${E.config.goLive ? ` <span class="chip ok">hecha el ${esc(ddmm(E.config.goLive.fecha ?? HOY))}</span>` : ""}</h3>
          <p class="small" style="margin:0">Después del día de prueba: borra turnos, cuentas de cargos, caja, pedidos, créditos pendientes y novedades enviadas. <b>Se conserva</b> lo maestro: canchas, horarios, precios, productos, usuarios y PIN, clientes y proveedores. Antes se descarga un respaldo.</p>
          <label class="row small" style="margin:6px 0"><input type="checkbox" id="gl-saldos" checked> Conservar los saldos (cuenta corriente, créditos y faltas de los clientes; deuda con proveedores)</label>
          <label class="row small" style="margin:0 0 6px"><input type="checkbox" id="gl-stock" checked> Conservar el stock contado</label>
          ${(() => { const pend = M.pendientesGoLive(E, AHORA); return pend.length ? `<div class="al media" role="status"><span class="lvl">Antes de limpiar</span><ul class="small" style="margin:4px 0 0;padding-left:18px">${pend.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>` : `<p class="small muted" style="margin:0 0 6px">Los turnos que todavía no se jugaron quedan, con su seña.</p>`; })()}
          <button type="button" class="btn danger" data-a="goLive">Hacer la limpieza para el go-live</button></div>
        ${seccionArchivo()}`
      : `<p class="small" style="margin:0 0 10px">Para el día de prueba en el local: el club arranca <b>vacío</b> (sin turnos, clientes ni caja; con las canchas, productos y usuarios de Break Point), con la hora real, y se guarda solo en esta compu. La demo de ejemplo no se toca.</p>
        <div class="row">${guardada ? `<button type="button" class="btn primary" data-a="jornada" data-v="retomar">Seguir la jornada real guardada</button>` : `<button type="button" class="btn primary" data-a="jornada" data-v="blanco">Empezar la jornada real en blanco</button>`}</div>
        ${guardada ? `<p class="small muted" style="margin:8px 0 0">En esta compu hay una jornada real guardada: desde la demo no se puede borrar. Para empezar otra, entrá a la jornada con el PIN de un dueño y usá «Empezar otra jornada en blanco».</p>` : ""}`}

    <section class="card" aria-labelledby="t-contactos">
      <div class="card-head"><h2 id="t-contactos">Avisos por WhatsApp</h2><span class="muted small">Se guardan sólo en esta compu</span></div>
      <div class="reglas">
        ${E.usuarios.filter((u) => u.rol === "duenio" && u.activo !== false).map((u) => `<label class="f">Celular de ${esc(u.nombre)} (pedidos de crédito)<input type="tel" inputmode="tel" placeholder="549 11 …" value="${esc(k[u.id] ?? "")}" data-a="contacto" data-v="${u.id}"></label>`).join("")}

}

// Archivar días cerrados: lo de hace más de 3 semanas con la caja cerrada pasa a un archivo que se descarga y en la
// compu queda el resumen. Las copias viejas de la jornada se ven acá con lo que ocupan y se borran con PIN de dueño.
// Nada se achica ni se borra sin que el dueño ELIJA el archivo descargado y el sistema compruebe que es el mismo.
function seccionArchivo() {
  const hasta = M.diaParaArchivar(E, AHORA);
  const copias = copiasEnLaCompu();
  const enCopias = copias.reduce((s, c) => s + c.largo, 0);
  const ultimo = E.archivo?.anexos?.at(-1);
  const dias = [...(E.archivo?.dias ?? [])].reverse();
  // Región viva estable (siempre está): sólo se anuncia cuando cambia, no en cada pantalla.
  const aviso = guardado.lleno ? `<div class="al alta"><span class="lvl">Se está llenando</span><p>${guardado.ok ? "Lo guardado en esta compu está cerca del tope del navegador." : "Ya no entra lo guardado en esta compu."} Archivá los días cerrados ahora y, si no las necesitás, borrá las copias viejas de abajo.</p></div>` : "";
  return `<div class="seccion" style="margin-top:12px" aria-labelledby="t-archivo"><h3 id="t-archivo">Archivar días cerrados</h3>
    <div id="archivo-aviso" role="status">${aviso}</div>
    <p class="small" style="margin:0">En esta compu la jornada ocupa <b class="num">${kb(guardado.bytes)}</b>${copias.length ? ` y las copias viejas, <b class="num">${kb(enCopias)}</b>` : ""}, de unos 5.000 KB que guarda el navegador. Para que no se llene, lo de los días con la <b>caja cerrada</b> hasta el <b class="num">${esc(ddmm(hasta))}</b> (más de 3 semanas) pasa a un <b>archivo que te descargás</b>: turnos jugados, cuentas cerradas, movimientos de caja y pedidos entregados. En el sistema queda el resumen de esos días.</p>
    <p class="small muted" style="margin:6px 0">No se toca: los turnos por jugar, las mesas abiertas, las cajas sin cerrar, la cuenta corriente y los créditos de cada cliente, ni nada con plata pendiente. Son dos pasos: bajás un archivo (el respaldo completo y esos días) y después lo elegís para comprobar que se guardó; recién ahí se achica.</p>
    ${ultimo ? `<p class="small muted" style="margin:0 0 6px">Último archivo: hasta el ${esc(ddmm(ultimo.hasta))}${ultimo.fecha ? `, hecho el ${esc(ddmm(ultimo.fecha))}` : ""}${ultimo.por ? ` por ${esc(ultimo.por)}` : ""} (${Number(ultimo.conteos?.reservas ?? 0)} turnos).</p>` : ""}
    ${dias.length ? `<details style="margin:0 0 8px"><summary class="small">Días archivados (${dias.length}): turnos y cobrado de cada uno</summary><ul class="small num" style="margin:4px 0 0;padding-left:18px;max-height:220px;overflow:auto">${dias.map((f) => `<li>${esc(ddmm(f.dia))} · ${Number(f.turnos)} ${Number(f.turnos) === 1 ? "turno" : "turnos"} · cobrado ${M.pesos(Number(f.cobradoCanchas) + Number(f.cobradoCuentas))}</li>`).join("")}</ul></details>` : ""}
    <button type="button" class="btn primary" data-a="archivar" id="btn-archivar">Archivar días cerrados</button>
    ${copias.length ? `<h4 style="margin:12px 0 4px">Copias viejas en esta compu</h4><ul class="small" style="margin:0;padding-left:18px">${copias.map((c) => `<li style="margin:4px 0">${esc(c.nombre)} · <span class="num">${kb(c.largo)}</span> <button type="button" class="btn sm" data-a="borrarCopia" data-v="${esc(c.sufijo)}" aria-label="Descargar y borrar: ${esc(c.nombre)}">Descargar y borrar</button></li>`).join("")}</ul>` : ""}
  </div>`;
}

// Paso 1 baja UN archivo (el navegador suele frenar la segunda descarga del mismo clic); paso 2 exige elegir ese
// archivo y comprueba que es el que se va a archivar. Sin `refrescar`: la ventana no se rearma y no pierde el PIN
// ni el archivo elegido; lo que cambia tras el paso 1 se toca a mano.
function dialogoArchivar() {
  const hasta = ui.archivoPendiente?.hasta ?? M.diaParaArchivar(E, AHORA);
  const p = ui.archivoPendiente;
  abrir({
    titulo: "Archivar días cerrados",
    sub: `Lo cerrado hasta el ${esc(ddmm(hasta))} pasa a un archivo que te quedás vos. Son dos pasos.`,
    cuerpo: `${campoPin("cf-pin")}
      <ol class="small" style="margin:10px 0 0;padding-left:18px">
        <li style="margin-bottom:10px"><b>Descargá el archivo.</b> Es uno solo: el respaldo completo de ahora y los días que se archivan.
          <div class="row" style="margin-top:6px"><button type="button" class="btn primary" data-a="bajarParaArchivar">Descargar el respaldo para archivar</button></div>
          <p id="ar-bajado" class="small muted" style="margin:6px 0 0">${p ? `Se pidió la descarga de <b>${esc(p.nombre)}</b>.` : ""}</p></li>
        <li><b>Elegí ese archivo</b> (fijate en Descargas) para comprobar que se guardó bien. Recién ahí se achica lo guardado en esta compu.
          <label class="f" style="margin-top:6px">Archivo descargado<input id="ar-archivo" type="file" accept=".json,application/json"></label></li>
      </ol>`,
    pie: `<button type="button" class="btn" data-a="cerrar">Cancelar</button><button type="button" class="btn danger" id="ar-achicar" data-a="confirmarArchivar" ${p ? "" : "disabled"}>Ya lo guardé: achicar</button>`,
    alAbrir(d) { $("#cf-pin", d).focus(); },
  });
}

// Lo mismo para borrar una copia vieja: se descarga, se elige lo descargado y se compara con la copia, letra por letra.
function dialogoCopia(c) {
  const bajada = ui.copiaBajada?.[c.sufijo];
  abrir({
    titulo: `Borrar de esta compu: ${esc(c.nombre)}`,
    sub: `Ocupa ${kb(c.largo)}. Primero la descargás y la elegís; recién ahí se borra.`,
    cuerpo: `${campoPin("cf-pin")}
      <ol class="small" style="margin:10px 0 0;padding-left:18px">
        <li style="margin-bottom:10px"><b>Descargá la copia.</b>
          <div class="row" style="margin-top:6px"><button type="button" class="btn primary" data-a="bajarCopia" data-v="${esc(c.sufijo)}">Descargar la copia</button></div>
          <p id="cp-bajada" class="small muted" style="margin:6px 0 0">${bajada ? `Se pidió la descarga de <b>${esc(bajada)}</b>.` : ""}</p></li>
        <li><b>Elegí ese archivo</b> para comprobar que es igual a la copia.
          <label class="f" style="margin-top:6px">Archivo descargado<input id="cp-archivo" type="file" accept=".json,application/json"></label></li>
      </ol>`,
    pie: `<button type="button" class="btn" data-a="cerrar">Cancelar</button><button type="button" class="btn danger" id="cp-borrar" data-a="confirmarBorrarCopia" data-v="${esc(c.sufijo)}" ${bajada ? "" : "disabled"}>Ya la guardé: borrar</button>`,
    alAbrir(d) { $("#cf-pin", d).focus(); },
  });
}

/** Lee el archivo elegido en un campo de archivo de la ventana (o null si no se eligió ninguno). */
async function textoElegido(sel) {
  const archivo = $(sel)?.files?.[0];
  if (!archivo) return null;
  try { return await archivo.text(); } catch { return ""; }
}
