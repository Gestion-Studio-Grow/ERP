# Proxy al admin panel de OpenMU (Blazor Server: necesita WebSockets sí o sí).
server {
    listen 80;
    server_name _;

    # El panel sube configs y exporta datos; el default de 1 MB queda corto.
    client_max_body_size 64m;

    location / {
        proxy_pass http://openmu:8080;
        proxy_http_version 1.1;

        # SignalR / Blazor Server
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El circuito de Blazor se cae si nginx corta la conexión ociosa.
        proxy_read_send_timeout 3600s;
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
        proxy_buffering         off;
    }
}
