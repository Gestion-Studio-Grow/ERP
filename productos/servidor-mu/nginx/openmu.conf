# Proxy al admin panel de OpenMU (Blazor Server: necesita WebSockets sí o sí).

# Connection: upgrade SOLO cuando el cliente pidió upgrade. Mandarlo siempre (el error
# clásico de las recetas copiadas) rompe el keep-alive con Kestrel y deja el proxy en un
# estado raro con requests que no son WebSocket.
map $http_upgrade $conexion_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # No regalar la versión de nginx en cada respuesta y en las páginas de error.
    server_tokens off;

    # El panel sube configs y exporta datos; el default de 1 MB queda corto.
    client_max_body_size 64m;

    location / {
        # Segunda capa de autenticación, independiente del login del panel.
        # La genera ./scripts/levantar.sh: vacía si el panel está en loopback,
        # con auth_basic si lo expusiste a la red. El archivo SIEMPRE existe
        # (está versionado) para que nginx nunca falle al arrancar por un include.
        include /etc/nginx/auth/auth.conf;

        proxy_pass http://openmu:8080;
        proxy_http_version 1.1;

        # SignalR / Blazor Server
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $conexion_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # A propósito NO usamos $proxy_add_x_forwarded_for: eso agrega lo que mandó el
        # cliente, que puede inventar cualquier IP. Somos el único proxy: la verdad es
        # $remote_addr y nada más.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El circuito de Blazor se cae si nginx corta la conexión ociosa.
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
        proxy_buffering         off;
    }
}
