# Vallas de CI — Célula 2 (Confiabilidad).
# ============================================================================
# POR QUÉ ESTE WORKFLOW ESTÁ SEPARADO EN JOBS (no un solo `npm run gates`):
# Antes las 7 vallas corrían en UN job; como el `lint` arrastra deuda crónica
# (roja hace tiempo), el job entero daba ROJO en TODOS los push. Resultado: si
# alguien rompía el login o una pantalla, la señal pasaba de rojo→rojo y NADIE se
# enteraba. El gate visual —que existe justamente porque un login roto llegó a
# prod con 929 tests en verde (incidente 2026-07-11)— no significaba nada.
#
# Ahora cada valla es un JOB con su propia señal:
#   · lint      → NO BLOQUEANTE (continue-on-error). Es deuda pre-existente; queda
#                 en amarillo y visible, pero NO enmascara al resto. Se salda aparte.
#   · tsc, tests, rls, build, visual, visual-aa → BLOQUEANTES.
#
# 🔒 REGLA DURA (no negociable): `visual` y `visual-aa` son BLOQUEANTES. Si una
#    página se ve rota o ilegible, el CI FALLA. Es la lección más cara que pagamos.
#
# NO toca prod ni Neon: ninguna valla necesita base de datos externa (la coverage
# de RLS es estática sobre el schema; los tests de integración usan un Postgres
# del propio job, con bases efímeras que crea y borra cada test; la valla visual
# corre el subset SIN DB —login de operador/admin + vidriera con branding
# fail-open—; la visual-aa levanta una base EFÍMERA en RAM con PGlite, sin Neon).
# El cliente Prisma se genera en el postinstall (`prisma generate`, sin DB).
#
# EFICIENCIA: `build` corre UNA vez y publica `.next` como artefacto; `visual` y
# `visual-aa` lo descargan en vez de rebuildear. Las vallas visuales renderizan en
# Chromium real (Playwright) y suben sus screenshots como artefacto del run.
# ============================================================================
name: gates

on:
  push:
  pull_request:

jobs:
  # ── Valla NO BLOQUEANTE: deuda de lint pre-existente ──────────────────────
  lint:
    name: lint (no-bloqueante · deuda pre-existente)
    runs-on: ubuntu-latest
    # continue-on-error: la deuda de lint queda VISIBLE (amarillo) pero NO tumba el
    # run ni enmascara a las demás vallas. Se salda por separado; ver el reporte de
    # la sesión ci/senal-verde.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  # ── Vallas ESTÁTICAS BLOQUEANTES (rápidas, sin navegador, sin build) ──────
  tsc:
    name: tsc (tipos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  # Los tests de integración corren contra bases EFÍMERAS que crea cada test en este Postgres
  # (src/test/base-efimera.ts: migraciones + RLS + app_rls; se borran al terminar). Nada de Neon.
  # `trust`: los roles de prueba (neondb_owner, app_rls) entran sin contraseña; el contenedor vive
  # lo que dura el job. Chromium: lo usan los tests de pantalla (`npm ci` no lo baja).
  # Node 22: `node --test "src/**/*.test.ts"` necesita Node 21 o más para expandir el patrón; con
  # Node 20 sale "Could not find" sin correr ningún test (.qa/ENG-000/npmtest-node20-como-ci-antes.txt).
  tests:
    name: tests (npm test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ERP_TEST_PG_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # La salida queda en un archivo: se sube como artefacto y la lee el chequeo de abajo.
      - name: npm test
        shell: bash
        run: npm test 2>&1 | tee npm-test.log
      # En CI no se saltea nada: un test salteado es un test que no corrió (ENG-000, criterio 1).
      # El resumen dice "# skipped N" (reporte TAP, sin terminal) o "ℹ skipped N" (reporte spec).
      - name: ningún test salteado
        if: always()
        shell: bash
        run: |
          grep -E '^(# |ℹ )(tests|pass|fail|skipped) ' npm-test.log || true
          grep -qxE '(# |ℹ )skipped 0' npm-test.log || { echo "::error::npm test salteó tests: en CI tienen que correr todos"; exit 1; }
      # Ninguna base efímera queda viva al terminar (ENG-000, criterio 4).
      - name: ninguna base erp_test_ quedó
        if: always()
        shell: bash
        run: |
          vivas=$(docker exec ${{ job.services.postgres.id }} psql -U postgres -Atc "SELECT count(*) FROM pg_database WHERE datname LIKE 'erp\_test\_%'")
          echo "bases erp_test_ vivas: $vivas"
          test "$vivas" = "0"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-test-log
          path: npm-test.log
          if-no-files-found: warn

  rls:
    name: rls-coverage (aislamiento)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node prisma/rls/check-coverage.mjs

  # ── BUILD BLOQUEANTE: corre una vez y comparte `.next` a las vallas visuales ──
  build:
    name: build (next build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Publicamos `.next` (sin la cache, que es pesada e innecesaria para `next
      # start`) para que visual/visual-aa no rebuildeen. include-hidden-files: el
      # dir arranca con "." y upload-artifact v4 lo excluiría por defecto.
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next/
            !.next/cache/**
          include-hidden-files: true
          retention-days: 1

  # ── Vallas VISUALES: BLOQUEANTES (no negociable) ──────────────────────────
  visual:
    name: visual (render real) · BLOQUEANTE
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Chromium para el render real. --with-deps trae las libs de SO.
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next/
      - run: npm run gate:visual
      # Screenshots del render como artefacto (siempre, para mirar cuando falla).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-gate-screenshots
          path: qa-shots/visual/
          if-no-files-found: warn

  visual-aa:
    name: visual-aa (contraste/touch/overflow) · BLOQUEANTE
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next/
      - run: npm run gate:visual:aa
      # Screenshots de la auditoría AA como artefacto (siempre).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-aa-screenshots
          path: qa-shots/audit/
          if-no-files-found: warn
