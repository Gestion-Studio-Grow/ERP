# Vallas de CI — Célula 2 (Confiabilidad).
# ============================================================================
# POR QUÉ ESTE WORKFLOW ESTÁ SEPARADO EN JOBS (no un solo `npm run gates`):
# Antes las 7 vallas corrían en UN job; como el `lint` arrastra deuda crónica
# (roja hace tiempo), el job entero daba ROJO en TODOS los push. Resultado: si
# alguien rompía el login o una pantalla, la señal pasaba de rojo→rojo y NADIE se
# enteraba. El gate visual —que existe justamente porque un login roto llegó a
# prod con 929 tests en verde (incidente 2026-07-11)— no significaba nada.
#
# Ahora cada valla es un JOB con su propia señal:
#   · lint, tsc, tests, tests-navegador, rls, build, visual, visual-aa → BLOQUEANTES.
#     (lint fue no-bloqueante mientras arrastró deuda; quedó en 0 errores el 09/11/2026, GSG-UAT-003.)
#   · tests-navegador: los tests que sólo abren Chromium (sin Postgres) corren aparte y en
#     paralelo; la lista está en scripts/ci/tests-navegador.txt. Entre «tests» y «tests-navegador»
#     corren todos los de `npm test` (scripts/ci/correr-tests.mjs).
#
# 🔒 REGLA DURA (no negociable): `visual` y `visual-aa` son BLOQUEANTES. Si una
#    página se ve rota o ilegible, el CI FALLA. Es la lección más cara que pagamos.
#
# NO toca prod ni Neon: ninguna valla necesita base de datos externa (la coverage
# de RLS es estática sobre el schema; los tests de integración usan un Postgres
# del propio job, con bases efímeras que crea y borra cada test; la valla visual
# corre el subset SIN DB —login de operador/admin + vidriera con branding
# fail-open—; la visual-aa levanta una base EFÍMERA en RAM con PGlite, sin Neon).
# El cliente Prisma se genera en el postinstall (`prisma generate`, sin DB).
#
# EFICIENCIA: `build` corre UNA vez y publica `.next` como artefacto; `visual` y
# `visual-aa` lo descargan en vez de rebuildear. Las vallas visuales renderizan en
# Chromium real (Playwright) y suben sus screenshots como artefacto del run.
# ============================================================================
name: gates

on:
  push:
  pull_request:

jobs:
  # ── Valla BLOQUEANTE: lint (0 errores; los avisos no frenan) ──────────────
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  # ── Vallas ESTÁTICAS BLOQUEANTES (rápidas, sin navegador, sin build) ──────
  tsc:
    name: tsc (tipos)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # El chequeo de tipos ya pide ~2,5 GB (medido el 22/10) y el tope por defecto de Node ronda 2 GB:
      # mismo heap que el build de Vercel (scripts/vercel-build.mjs) para que no se caiga por OOM.
      - run: npx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  # Los tests de integración corren contra bases EFÍMERAS que crea cada test en este Postgres
  # (src/test/base-efimera.ts: migraciones + RLS + app_rls; se borran al terminar). Nada de Neon.
  # `trust`: los roles de prueba (neondb_owner, app_rls) entran sin contraseña; el contenedor vive
  # lo que dura el job. Chromium: lo usan los tests de pantalla (`npm ci` no lo baja).
  # Node 22: `node --test "src/**/*.test.ts"` necesita Node 21 o más para expandir el patrón; con
  # Node 20 sale "Could not find" sin correr ningún test (.qa/ENG-000/npmtest-node20-como-ci-antes.txt).
  tests:
    name: tests (npm test)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ERP_TEST_PG_URL: postgresql://postgres@localhost:5432/postgres
      # Hora fija y la misma que producción (Vercel corre en UTC): un test que depende del huso
      # falla igual en cada corrida, no según la máquina.
      TZ: UTC
      # Los 2 tests del paquete Gate 2 se salteaban sin esta URL (y el paso «skipped 0» frenaba).
      # Es el mismo Postgres efímero del job: crean su base y su rol propios y los borran.
      GATE2_PG_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # El Postgres del job vuelca TODO su log al apagarse («Stop containers», después del último paso):
      # miles de líneas de checkpoints y de ERROR que los tests provocan a propósito (claves únicas,
      # serialización, RLS) tapaban el resumen de fallidos en la cola del log. Sólo se apaga ese ruido.
      - name: Postgres del job sin log de ruido
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U postgres -c "ALTER SYSTEM SET log_checkpoints = off"
          -c "ALTER SYSTEM SET log_min_messages = fatal" -c "ALTER SYSTEM SET log_min_error_statement = panic"
          -c "SELECT pg_reload_conf()"
      # La salida queda en un archivo: se sube como artefacto y la lee el chequeo de abajo.
      # Todos los de `npm test` menos los de sólo-navegador, que corren en «tests-navegador».
      # pipefail: si fallan los tests, falla el paso (sin él mandaría el código de `tee`).
      - name: npm test (sin los de sólo-navegador)
        shell: bash
        run: |
          set -o pipefail
          node scripts/ci/correr-tests.mjs resto 2>&1 | tee npm-test.log
      # En CI no se saltea nada: un test salteado es un test que no corrió (ENG-000, criterio 1).
      # El resumen dice "# skipped N" (reporte TAP, sin terminal) o "ℹ skipped N" (reporte spec).
      - name: ningún test salteado
        if: always()
        shell: bash
        run: |
          grep -E '^(# |ℹ )(tests|pass|fail|skipped) ' npm-test.log || true
          grep -qxE '(# |ℹ )skipped 0' npm-test.log || { echo "::error::npm test salteó tests: en CI tienen que correr todos"; exit 1; }
      # Ninguna base efímera queda viva al terminar (ENG-000, criterio 4).
      - name: ninguna base erp_test_ quedó
        if: always()
        shell: bash
        run: |
          vivas=$(docker exec ${{ job.services.postgres.id }} psql -U postgres -Atc "SELECT count(*) FROM pg_database WHERE datname LIKE 'erp\_test\_%'")
          echo "bases erp_test_ vivas: $vivas"
          test "$vivas" = "0"
      # El log subido es diagnóstico, no veredicto: el veredicto lo dan los tres pasos de arriba (npm test con
      # pipefail, ningún salteado, ninguna base viva); el resumen de abajo sólo imprime los fallidos. Por eso un tropiezo del servicio de artefactos de GitHub no
      # pone el job en rojo: el 11/11 (run 43092727474, main c15c3f7) los 8659 tests pasaron y el job quedó rojo
      # porque CreateArtifact devolvió una página HTML en vez de JSON 5 veces seguidas (10 minutos de reintentos).
      # Con tope de 3 minutos para que una caída del servicio no se coma el timeout del job.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        with:
          name: npm-test-log
          path: npm-test.log
          if-no-files-found: warn
      # Último paso: la lista de tests fallidos (y salteados) con archivo:línea y el motivo, en el log y en el
      # resumen del run. El log entero llega truncado a quien lo lee de lejos (get_job_logs da la cola) y el
      # artefacto no siempre se puede bajar: con esto los nombres están siempre al final. Sólo informa.
      - name: tests fallidos (resumen)
        if: always()
        shell: bash
        run: node scripts/ci/resumen-tests.mjs npm-test.log

  # Tests que sólo abren Chromium y no usan Postgres (scripts/ci/tests-navegador.txt): sin servicio
  # de base, en paralelo con «tests». Mismo criterio: ninguno salteado.
  tests-navegador:
    name: tests-navegador (Chromium, sin base)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: tests de navegador
        shell: bash
        run: |
          set -o pipefail
          node scripts/ci/correr-tests.mjs navegador 2>&1 | tee tests-navegador.log
      - name: ningún test salteado
        if: always()
        shell: bash
        run: |
          grep -E '^(# |ℹ )(tests|pass|fail|skipped) ' tests-navegador.log || true
          grep -qxE '(# |ℹ )skipped 0' tests-navegador.log || { echo "::error::tests-navegador salteó tests: en CI tienen que correr todos"; exit 1; }
      - name: tests fallidos (resumen)
        if: always()
        shell: bash
        run: node scripts/ci/resumen-tests.mjs tests-navegador.log

  rls:
    name: rls-coverage (aislamiento)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node prisma/rls/check-coverage.mjs

  # ── BUILD BLOQUEANTE: corre una vez y comparte `.next` a las vallas visuales ──
  build:
    name: build (next build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      # Publicamos `.next` (sin la cache, que es pesada e innecesaria para `next
      # start`) para que visual/visual-aa no rebuildeen. include-hidden-files: el
      # dir arranca con "." y upload-artifact v4 lo excluiría por defecto.
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next/
            !.next/cache/**
          include-hidden-files: true
          retention-days: 1

  # ── Vallas VISUALES: BLOQUEANTES (no negociable) ──────────────────────────
  visual:
    name: visual (render real) · BLOQUEANTE
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Chromium para el render real. --with-deps trae las libs de SO.
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next/
      - run: npm run gate:visual
      # Screenshots del render como artefacto (siempre, para mirar cuando falla).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-gate-screenshots
          path: qa-shots/visual/
          if-no-files-found: warn

  visual-aa:
    name: visual-aa (contraste/touch/overflow) · BLOQUEANTE
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next/
      - run: npm run gate:visual:aa
      # Screenshots de la auditoría AA como artefacto (siempre).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-aa-screenshots
          path: qa-shots/audit/
          if-no-files-found: warn
