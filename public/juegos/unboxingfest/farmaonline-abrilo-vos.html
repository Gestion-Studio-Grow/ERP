  legal: `<p><b>Borrador: requiere revisión de un abogado matriculado y la confirmación de Farmaonline antes de publicarse.</b></p><h3>Términos y condiciones</h3><p><b>1. Organizador.</b> [a confirmar: razón social de Farmaonline], CUIT [a confirmar], domicilio [a confirmar] («Farmaonline»). Producción: MIA Producciones [a confirmar: razón social y CUIT]. Tecnología: Gestión Studio Grow. Consultas: [a confirmar: email o WhatsApp].</p>
<p><b>2. Vigencia y lugar.</b> 5 de diciembre de 2026, durante el horario del stand de Farmaonline en el festival POP FEST 101.5, Parque Norte, Ciudad Autónoma de Buenos Aires [a confirmar: horario].</p>
<p><b>3. Quiénes participan.</b> Cualquier asistente puede jugar. Para dejar datos y recibir el premio hay que ser mayor de 18 años. Los menores juegan sin dejar datos; si están con su madre, padre o tutor, el adulto puede registrarse a su nombre y retirar el premio. No participa el personal afectado a la activación.</p>
<p><b>4. Mecánica.</b> Se juega en la tablet del stand, en las de los promotores o en el celular propio vía código QR. El puntaje no influye en el premio: todo el que termina un juego y completa el formulario aceptando estos términos recibe un premio, sujeto a stock. No hay sorteo ni azar, y no hace falta comprar nada.</p>
<p><b>5. Premios y stock.</b> [a confirmar: productos y cantidad de unidades de cada uno]. Se entregan por orden de llegada al canje. Agotado el stock físico, el premio es un cupón de descuento digital para la tienda online de Farmaonline [a confirmar: porcentaje o monto, tope, vencimiento (mínimo 30 días), compra mínima, si se acumula]. No se cambian por dinero ni por otros productos. Ningún premio es un medicamento.</p>
<p><b>6. Cómo se retira.</b> Al completar el formulario, la pantalla muestra un código personal, de un solo uso. El premio de ese código se activa sólo en el stand: escaneando con el celular el código QR de la pantalla del stand (cambia cada minuto), con una tarjeta de un solo uso entregada por el organizador [a confirmar] o por el personal en el mostrador. Se canjea sólo en forma presencial en el stand hasta su cierre y está sujeto a stock (si el premio físico se agotó, se entrega un cupón online [a confirmar]). Para entregarlo, el personal valida el código contra el registro central, pide el nombre con el que se registró y marca la mano de quien retira con un sello del stand. Jugar fuera del stand no da premios ni beneficios canjeables online. Si no se retiró, el premio físico caduca y se envía el cupón digital al email registrado [a confirmar].</p>
<p><b>7. Límite.</b> Un premio por persona, por email y por número de WhatsApp, aunque juegue varias veces o en varios dispositivos. Se puede volver a jugar todas las veces que se quiera, pero sólo la primera participación registrada da premio; las siguientes son sin premio. Si una misma persona obtiene más de un código, vale sólo el primero. Quien ya tiene el sello del stand no puede retirar otro premio.</p>
<p><b>8. Descalificación.</b> Se anula el código ante datos falsos o de terceros, registros múltiples, programas automáticos o manipulación del juego, falsedad sobre la edad o conductas que afecten la seguridad del stand.</p>

    if (sub) { g.font = `600 22px ${CFG.fontCanvas}`; g.fillText(sub, w / 2, h * .61); }
  });
}

// ---- Caja de cartón con solapas y cinta de la marca a lo largo de la unión ----
function makeBox({ w = 1.6, h = 1.0, d = 1.2, open = 0, special = false } = {}) {
  const grp = new THREE.Group();
  const kraft = new THREE.MeshStandardMaterial({ map: kraftTex(), roughness: .92, metalness: 0 });
  const inner = new THREE.MeshStandardMaterial({ color: '#8a6440', roughness: 1, side: THREE.DoubleSide });
  const t = .04;
  const wall = (W, H, D) => new THREE.Mesh(new THREE.BoxGeometry(W, H, D), kraft);
  const parts = [[w, t, d, 0, t / 2, 0], [w, h, t, 0, h / 2, d / 2 - t / 2], [w, h, t, 0, h / 2, -d / 2 + t / 2], [t, h, d, -w / 2 + t / 2, h / 2, 0], [t, h, d, w / 2 - t / 2, h / 2, 0]];
  parts.forEach(([W, H, D, x, y, z]) => { const m = wall(W, H, D); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; grp.add(m); });
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(w - 2 * t, d - 2 * t), inner); fl.rotation.x = -Math.PI / 2; fl.position.y = t + .002; grp.add(fl);
  // estampa del logo en el frente (tinta sobre cartón)
  const lt = new THREE.TextureLoader().load(CFG.logoDark); lt.colorSpace = THREE.SRGBColorSpace;
  const stamp = new THREE.Mesh(new THREE.PlaneGeometry(w * .62, w * .62 * 36.6 / 278.9), new THREE.MeshBasicMaterial({ map: lt, transparent: true, opacity: .82 }));
  stamp.position.set(0, h * .5, d / 2 + .002); grp.add(stamp);
  const flaps = [];
  const mk = (W, D, px, pz, axis, sign, y) => {
    const piv = new THREE.Group(); piv.position.set(px, y, pz);
    const m = new THREE.Mesh(new THREE.BoxGeometry(W, t * .7, D), kraft); m.castShadow = true;
    if (axis === 'x') m.position.z = sign * D / 2; else m.position.x = sign * W / 2;
    piv.add(m); piv.userData = { axis, sign }; grp.add(piv); flaps.push(piv); return piv;
  };
  // solapas mayores (se juntan en la unión, a lo largo de x) y menores debajo
  const fA = mk(w, d / 2, 0, d / 2, 'x', -1, h + t * .35), fB = mk(w, d / 2, 0, -d / 2, 'x', 1, h + t * .35);
  mk(w * .45, d * .94, -w / 2, 0, 'z', 1, h - t * .4); mk(w * .45, d * .94, w / 2, 0, 'z', -1, h - t * .4);
  // cinta: dos mitades (una por solapa), con el logo repetido
  const tw = .26, tl = w * 1.0;
  const tex = tapeTex(special);
  const half = (v0, v1, z, piv) => {
    const g = new THREE.PlaneGeometry(tl, tw / 2); const uv = g.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setY(i, uv.getY(i) ? v1 : v0);
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: tex, roughness: .35, polygonOffset: true, polygonOffsetFactor: -2 }));
    m.rotation.x = -Math.PI / 2; m.position.set(0, t * .36, z); piv.add(m); return m;
  };
  half(0, .5, -d / 2 + tw / 4, fA); half(.5, 1, d / 2 - tw / 4, fB); // la unión de las solapas queda en z=0 de la caja
  grp.userData.setOpen = k => {
    flaps.forEach((p, i) => {
      const a = (i < 2 ? 2.05 : 1.9) * ease(clamp(i < 2 ? k * 1.5 : k * 1.6 - .5));
      if (p.userData.axis === 'x') p.rotation.x = -p.userData.sign * a; else p.rotation.z = p.userData.sign * a;
    });
  };
  grp.userData.setOpen(open);
  grp.userData.size = { w, h, d, top: h + t * .7, tapeLen: tl, tapeW: tw };
  return grp;
}

// ---- Productos genéricos de cuidado personal (sin marcas de terceros) ----
const P = () => CFG.colors;
function lathe(points, seg = 28) { return new THREE.LatheGeometry(points.map(([x, y]) => new THREE.Vector2(x, y)), seg); }
function std(color, o = {}) { return new THREE.MeshStandardMaterial({ color, roughness: .35, metalness: 0, ...o }); }
const PRODUCTS = {
  protector: { name: 'Protector solar', cat: 'sol' },
  serum: { name: 'Sérum', cat: 'skin' },
  crema: { name: 'Crema hidratante', cat: 'skin' },
  labial: { name: 'Labial', cat: 'make' },
  perfume: { name: 'Perfume', cat: 'make' },
  shampoo: { name: 'Shampoo', cat: 'cuidado' },
  agua: { name: 'Agua', cat: 'hidra' },
  barrita: { name: 'Barra de cereal', cat: 'deporte' },
};
function makeProduct(kind, s = 1) {
  const C = P(); const g = new THREE.Group();
  const add = (geo, mat, y = 0, x = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; g.add(m); return m; };
  if (kind === 'protector') {
    const body = add(lathe([[0, 0], [.2, 0], [.24, .05], [.24, .62], [.2, .7], [.08, .74], [0, .74]]), std('#fff6e0', { map: labelTex('#fff6e0', C.orange, 'FPS 50', 'protector') }));
    body.scale.z = .62; add(new THREE.CylinderGeometry(.1, .12, .16, 20), std(C.orange), .8);
  } else if (kind === 'serum') {
    add(lathe([[0, 0], [.16, 0], [.17, .04], [.17, .42], [.08, .5], [.06, .52], [0, .52]]), std('#e8d3ff', { roughness: .08, transparent: true, opacity: .85, map: labelTex('#e8d3ff', C.violet, 'SÉRUM', 'hialurónico') }));
    add(new THREE.CylinderGeometry(.06, .06, .1, 16), std('#ffffff'), .57); add(new THREE.SphereGeometry(.075, 16, 12), std(C.ink), .66);
  } else if (kind === 'crema') {
    add(new THREE.CylinderGeometry(.3, .3, .26, 32), std('#ffffff', { map: labelTex('#ffffff', C.blue, 'HIDRA', '24 h') }), .13);
    add(new THREE.CylinderGeometry(.31, .31, .1, 32), std(C.blue), .31);
  } else if (kind === 'labial') {
    add(new THREE.CylinderGeometry(.09, .09, .34, 20), std(C.ink, { metalness: .6, roughness: .25 }), .17);
    add(new THREE.CylinderGeometry(.075, .075, .08, 20), std('#d4af7a', { metalness: .9, roughness: .2 }), .38);
    const bullet = add(new THREE.CylinderGeometry(.04, .062, .18, 20), std(C.red, { roughness: .3 }), .5); bullet.rotation.z = .12;
  } else if (kind === 'perfume') {
    add(new THREE.BoxGeometry(.4, .42, .2), std(C.magenta, { roughness: .05, transparent: true, opacity: .78 }), .21);
    add(new THREE.CylinderGeometry(.04, .04, .06, 12), std('#d4af7a', { metalness: .9, roughness: .2 }), .45);
    add(new THREE.BoxGeometry(.18, .14, .14), std(C.ink, { roughness: .2 }), .54);
  } else if (kind === 'shampoo') {
    const b = add(lathe([[0, 0], [.2, 0], [.23, .06], [.21, .66], [.12, .76], [0, .78]]), std(C.teal, { map: labelTex(C.teal, '#ffffff', 'BRILLO', 'shampoo') })); b.scale.z = .55;
    add(new THREE.CylinderGeometry(.08, .1, .1, 16), std('#ffffff'), .82);
  } else if (kind === 'agua') {
    add(lathe([[0, 0], [.16, 0], [.17, .05], [.16, .3], [.17, .5], [.12, .62], [.07, .66], [0, .66]]), std('#bfe6ff', { roughness: .05, transparent: true, opacity: .6 }));
    add(new THREE.CylinderGeometry(.165, .165, .14, 24, 1, true), std(C.blue, { map: labelTex(C.blue, '#ffffff', 'AGUA', 'hidratate'), side: THREE.DoubleSide }), .38);
    add(new THREE.CylinderGeometry(.075, .075, .08, 16), std(C.blue), .7);
  } else { // barrita
    add(new THREE.BoxGeometry(.6, .1, .2), std(C.orange, { map: labelTex(C.orange, '#ffffff', 'ENERGÍA', 'cereal') }), .05);
  }
  g.scale.setScalar(s); g.userData.kind = kind;
  return g;
}

// ---- Isotipo «ô» plano (el logo no se extruye ni se deforma): placa con la imagen oficial ----
function makeIsoBadge({ size = .8, dark = true, disc = '#ffffff' } = {}) {
  const tex = new THREE.TextureLoader().load(dark ? CFG.isoDark : CFG.isoWhite); tex.colorSpace = THREE.SRGBColorSpace;
  const g = new THREE.Group();
  const d = new THREE.Mesh(new THREE.CircleGeometry(size * .62, 40), new THREE.MeshBasicMaterial({ color: disc })); g.add(d);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(size * .85 * 31.13 / 36.59, size * .85), new THREE.MeshBasicMaterial({ map: tex, transparent: true })); m.position.z = .005; g.add(m);
  return g;
}

// ---- Confeti / chispas ----
function makeBurst(scene, n = 120) {
  const geo = new THREE.PlaneGeometry(.09, .05);
  const mat = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, vertexColors: false });
  const mesh = new THREE.InstancedMesh(geo, mat, n); mesh.frustumCulled = false; mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  const C = CFG.colors, cols = [C.magenta, C.violet, C.orange, C.blue, C.teal, '#ffffff'].map(c => new THREE.Color(c));
  const parts = Array.from({ length: n }, (_, i) => ({ life: 0, p: new THREE.Vector3(), v: new THREE.Vector3(), r: new THREE.Euler(), w: new THREE.Vector3() }));
  parts.forEach((_, i) => mesh.setColorAt(i, cols[i % cols.length]));
  scene.add(mesh); let next = 0; const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), S = new THREE.Vector3(1, 1, 1), Z = new THREE.Vector3(0, 0, 0);
  return {
    emit(at, count = 24, power = 3) { for (let k = 0; k < count; k++) { const p = parts[next = (next + 1) % n]; p.life = rand(.8, 1.4); p.p.copy(at); p.v.set(rand(-1, 1), rand(.6, 1.6), rand(-1, 1)).multiplyScalar(power); p.w.set(rand(-9, 9), rand(-9, 9), rand(-9, 9)); } },
    tick(dt) { parts.forEach((p, i) => { if (p.life > 0) { p.life -= dt; p.v.y -= 6 * dt; p.v.multiplyScalar(1 - .8 * dt); p.p.addScaledVector(p.v, dt); p.r.x += p.w.x * dt; p.r.y += p.w.y * dt; Q.setFromEuler(p.r); M.compose(p.p, Q, p.life > 0 ? S : Z); } else M.compose(p.p, Q, Z); mesh.setMatrixAt(i, M); }); mesh.instanceMatrix.needsUpdate = true; },
  };
}


const K = window.Kit;
let ROUND = K.round;
const stage = createStage({ fov: 38 });
const { scene, camera, ticks } = stage;
Object.assign(stage.fit, { w: 7.2, h: 3.6, y: .4, tilt: .95, pad: [80, 70] });
await loadLogoImage();

// ---- Cinta transportadora ----
const belt = new THREE.Group(); scene.add(belt);
const beltTex = canvasTex('belt', 256, 64, (g, w, h) => { g.fillStyle = '#23282b'; g.fillRect(0, 0, w, h); g.fillStyle = '#2f3539'; for (let x = 0; x < w; x += 32) g.fillRect(x, 0, 14, h); }, true);
beltTex.repeat.set(10, 1);
const beltMesh = new THREE.Mesh(new THREE.BoxGeometry(30, .16, 1.9), new THREE.MeshStandardMaterial({ map: beltTex, roughness: .8 }));
beltMesh.position.y = -.08; beltMesh.receiveShadow = true; belt.add(beltMesh);
const railMat = new THREE.MeshStandardMaterial({ color: '#c9cdd1', metalness: .8, roughness: .3 });
[-1, 1].forEach(s => { const r = new THREE.Mesh(new THREE.BoxGeometry(30, .12, .1), railMat); r.position.set(0, .02, s * 1.0); belt.add(r); });
const neon = new THREE.Mesh(new THREE.BoxGeometry(30, .04, .04), new THREE.MeshBasicMaterial({ color: CONFIG.colors.magenta }));
neon.position.set(0, -.12, 1.0); belt.add(neon);
const base = new THREE.Mesh(new THREE.BoxGeometry(30, .6, 2.2), new THREE.MeshStandardMaterial({ color: '#15191b', roughness: .9 }));
base.position.y = -.46; belt.add(base);

// ---- Estado del juego ----
const G = { ts: 1, boxes: [], t: 0, left: ROUND, score: 0, combo: 0, opened: 0, spawnIn: 0, running: false, attract: true };
const burst = makeBurst(scene, 160); ticks.add(dt => burst.tick(dt));
const KINDS = ['protector', 'serum', 'crema', 'labial', 'perfume', 'shampoo', 'agua', 'barrita'];
const halfW = () => { const d = camera.position.length(); return d * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect + 1.6; };

function spawn(x0) {
  const t = G.running ? (ROUND - G.left) / ROUND : 0;
  const special = G.running && Math.random() < .14;
  const box = makeBox({ w: 1.5, h: .9, d: 1.1, special });
  const yawSet = t < .25 ? [0] : t < .55 ? [0, .5, -.5] : [0, .6, -.6, Math.PI / 2 * .9];
  box.rotation.y = pick(yawSet) + rand(-.08, .08);
  box.position.set(x0 ?? -halfW(), 0, rand(-.15, .15));
  box.userData.spin = t > .7 ? rand(-.35, .35) : 0;
  box.userData.state = 'closed'; box.userData.open = 0; box.userData.special = special;
  box.traverse(o => { if (o.isMesh) o.castShadow = true; });
  scene.add(box); G.boxes.push(box);
  return box;
}
function speed() { const t = G.running ? (ROUND - G.left) / ROUND : 0; return 1.15 + t * 1.5; }
function spawnGap() { const t = G.running ? (ROUND - G.left) / ROUND : 0; return lerp(2.3, 1.15, t); }

// ---- Producto que sale de la caja ----
const floaters = [];
function popProduct(box) {
  const p = makeProduct(pick(KINDS), 1.25);
  p.position.copy(box.position).add(new THREE.Vector3(0, .3, 0)); scene.add(p);
  floaters.push({ p, t: 0, from: p.position.clone() });
}
ticks.add(dt0 => {
  const dt = dt0 * G.ts;
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i]; f.t += dt; const k = f.t / 1.4;
    f.p.position.y = f.from.y + Math.sin(Math.min(k, 1) * Math.PI * .5) * 1.7; f.p.position.x = f.from.x + f.t * speed() * .5;
    f.p.rotation.y += dt * 4; const s = k < .8 ? 1 : 1 - (k - .8) / .2; f.p.scale.setScalar(1.25 * Math.max(.001, s));
    if (k >= 1) { scene.remove(f.p); floaters.splice(i, 1); }
  }
});

// ---- Rastro del dedo (capa 2D) ----
const trail = document.createElement('canvas'); trail.id = 'trail';
Object.assign(trail.style, { position: 'fixed', inset: '0', width: '100%', height: '100%', pointerEvents: 'none', zIndex: 4 });
document.body.append(trail); const tg = trail.getContext('2d');
let pts = [];
function sizeTrail() { trail.width = innerWidth * Math.min(devicePixelRatio, 2); trail.height = innerHeight * Math.min(devicePixelRatio, 2); tg.setTransform(Math.min(devicePixelRatio, 2), 0, 0, Math.min(devicePixelRatio, 2), 0, 0); }
addEventListener('resize', sizeTrail); sizeTrail();
ticks.add(() => {
  tg.clearRect(0, 0, innerWidth, innerHeight); const now = performance.now();
  pts = pts.filter(p => now - p.t < 260); if (pts.length < 2) return;
  tg.lineCap = tg.lineJoin = 'round';
  for (let i = 1; i < pts.length; i++) { const a = 1 - (now - pts[i].t) / 260; tg.strokeStyle = `rgba(255,255,255,${a})`; tg.lineWidth = 10 * a + 2; tg.shadowColor = CONFIG.colors.magenta; tg.shadowBlur = 16; tg.beginPath(); tg.moveTo(pts[i - 1].x, pts[i - 1].y); tg.lineTo(pts[i].x, pts[i].y); tg.stroke(); }
});

// ---- Corte: el trazo tiene que recorrer la cinta de la caja ----
let stroke = null; // por caja: tramo de cinta recorrido, medido con la caja donde estaba en cada instante
const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function addPoint(e) {
  for (const box of G.boxes) {
    if (box.userData.state !== 'closed') continue;
    const sz = box.userData.size; plane.constant = -(box.position.y + sz.top);
    const p = stage.onPlane(e, plane); if (!p) continue;
    box.updateMatrixWorld(); p.applyMatrix4(box.matrixWorld.clone().invert());
    const half = sz.tapeLen / 2;
    if (Math.abs(p.z) < TOL && Math.abs(p.x) < half + .2) {
      let h = stroke.get(box); if (!h) stroke.set(box, h = { lo: Infinity, hi: -Infinity, dsum: 0, n: 0 });
      h.lo = Math.min(h.lo, p.x); h.hi = Math.max(h.hi, p.x); h.dsum += Math.abs(p.z); h.n++;
    }
  }
}
const TOL = .32;
function evalStroke(final) {
  if (!stroke) return;
  for (const [box, h] of stroke) {
    if (box.userData.state !== 'closed' || h.n < 2) continue;
    const half = box.userData.size.tapeLen / 2;
    const cover = clamp((Math.min(h.hi, half) - Math.max(h.lo, -half)) / (2 * half));
    const prec = clamp(1 - h.dsum / h.n / TOL);
    if (cover >= .9 || (final && cover >= .55)) { cut(box, cover, prec); stroke = new Map(); return; }
  }
}
function cut(box, cover, prec) {
  box.userData.state = 'opening';
  G.combo++; G.opened++;
  const perfect = prec > .72 && cover > .85;
  let pts_ = Math.round(60 + 40 * prec * cover + (perfect ? 30 : 0));
  const mult = Math.min(4, 1 + Math.floor(G.combo / 3));
  if (box.userData.special) pts_ *= 2;
  pts_ *= mult; G.score += pts_; K.setScore(G.score);
  K.toast((perfect ? '¡Corte perfecto!' : '¡Abierta!') + ' +' + pts_ + (mult > 1 ? '  x' + mult : ''));
  K.sfx(perfect ? 'win' : 'ok'); K.buzz(25);
  burst.emit(box.position.clone().add(new THREE.Vector3(0, 1, 0)), box.userData.special ? 50 : 26, 3.2);
  setTimeout(() => popProduct(box), 240);
}
stage.canvas.addEventListener('pointerdown', e => { if (!G.running) return; stage.canvas.setPointerCapture(e.pointerId); stroke = new Map(); addPoint(e); pts.push({ x: e.clientX, y: e.clientY, t: performance.now() }); });
stage.canvas.addEventListener('pointermove', e => {
  if (!G.running || !stroke) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  evs.forEach(ev => { addPoint(ev); pts.push({ x: ev.clientX, y: ev.clientY, t: performance.now() }); });
  evalStroke(false);
});
const endStroke = () => { if (stroke) evalStroke(true); stroke = null; };
stage.canvas.addEventListener('pointerup', endStroke); stage.canvas.addEventListener('pointercancel', endStroke);

// ---- Bucle ---- (G.ts: factor de tiempo sólo para QA; en el stand vale 1)
ticks.add((dt0, t) => {
  const dt = dt0 * G.ts;
  beltTex.offset.x -= dt * speed() / 3;
  const hw = halfW();
  G.spawnIn -= dt; if ((G.running || G.attract) && G.spawnIn <= 0) { spawn(); G.spawnIn = G.attract ? 2.2 : spawnGap(); }
  for (let i = G.boxes.length - 1; i >= 0; i--) {
    const b = G.boxes[i]; b.position.x += speed() * dt; b.rotation.y += b.userData.spin * dt;
    if (b.userData.state === 'opening') { b.userData.open = Math.min(1, b.userData.open + dt * 2.2); b.userData.setOpen(b.userData.open); if (b.userData.open >= 1) b.userData.state = 'open'; }
    if (G.attract && b.userData.state === 'closed' && b.position.x > -.3) { b.userData.state = 'opening'; burst.emit(b.position.clone().add(new THREE.Vector3(0, 1, 0)), 16, 2.6); setTimeout(() => popProduct(b), 240); }
    if (b.position.x > hw) {
      if (G.running && b.userData.state === 'closed') { G.combo = 0; K.toast('¡Se fue una caja!', 700); K.sfx('bad'); }
      scene.remove(b); G.boxes.splice(i, 1);
    }
  }
  if (G.running) {
    G.left -= dt; K.setTime(G.left, ROUND);
    if (G.left <= 0) { G.running = false; G.attract = false; stroke = null; K.end(G.score, { opened: G.opened }); }
  }
});

function clearBoxes() { G.boxes.forEach(b => scene.remove(b)); G.boxes = []; floaters.forEach(f => scene.remove(f.p)); floaters.length = 0; }
K.hooks = {
  attract() { G.attract = true; G.running = false; setDim(stage, .3); },
  howto() { G.attract = false; setDim(stage, .55); },
  prepare() { clearBoxes(); ROUND = K.round; G.left = ROUND; G.score = 0; G.combo = 0; G.opened = 0; K.setTime(ROUND, ROUND); G.attract = false; },
  start() { G.running = true; spawn(-halfW() * .45); G.spawnIn = spawnGap(); K.help('Pasá el dedo <b>a lo largo de la cinta</b> de cada caja'); setTimeout(() => { if (G.running) K.help(null); }, 5000); },
  reset() { G.running = false; clearBoxes(); },
};
// QA: posición en pantalla de la cinta de cada caja cerrada
window.gameDebug = {
  G, K,
  tapes() {
    return G.boxes.filter(b => b.userData.state === 'closed').map(b => {
      b.updateMatrixWorld(); const sz = b.userData.size; const h = sz.tapeLen / 2;
      const a = stage.toScreen(new THREE.Vector3(-h, sz.top, 0).applyMatrix4(b.matrixWorld)), c = stage.toScreen(new THREE.Vector3(h, sz.top, 0).applyMatrix4(b.matrixWorld));
      return { a, c, x: b.position.x, special: b.userData.special };
    });
  },
};
stage.resize();
for (let i = 0; i < 3; i++) spawn(-halfW() + i * 2.6);
await stage.warm();
K.ready();

</script>
