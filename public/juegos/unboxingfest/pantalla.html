:root{color-scheme:dark;--bg:#11181A;--ink:#fff;--m:#C23776;--t:#42BFBA;--line:#6B7A7E}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;overflow:hidden}
body{background:radial-gradient(120% 70% at 10% -10%,rgba(194,55,118,.55),transparent 60%),radial-gradient(90% 60% at 110% 10%,rgba(66,191,186,.35),transparent 60%),var(--bg)}
main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:3vh 16px;text-align:center}
img.logo{height:clamp(28px,5vh,56px)}
h1{font-weight:800;font-size:clamp(26px,5.4vh,64px);line-height:1.05;margin:0}
h1 em{font-style:normal;color:var(--m)}
#qr{width:min(58vh,84vw);aspect-ratio:1;background:#fff;border-radius:24px;padding:2vh;box-shadow:0 0 0 8px rgba(194,55,118,.35)}
#qr svg{display:block;width:100%;height:100%}
.bar{width:min(58vh,84vw);height:10px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}
.bar i{display:block;height:100%;background:var(--t);transition:width 1s linear}
p{font-size:clamp(15px,2.4vh,26px);margin:0;opacity:.92}
form{display:grid;gap:12px;width:min(420px,100%)}
input,button{font:inherit;font-size:20px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
button{background:var(--m);border:0;font-weight:800;border-radius:999px;min-height:52px;cursor:pointer}
#salir{position:fixed;left:10px;bottom:6px;font-size:12px;padding:6px 10px;min-height:0;background:transparent;border:1px solid var(--line);opacity:.5}
.credit{position:fixed;right:10px;bottom:4px;font-size:11px;opacity:.8}
:focus-visible{outline:3px solid var(--t);outline-offset:3px}

<script>// QR propio (modo byte, corrección M, versiones 1 a 10), sin dependencias. Algoritmo según ISO/IEC 18004.
window.QR = (() => {
  const ECC = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26], BLK = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5];
  const rawMods = v => { let r = (16 * v + 128) * v + 64; if (v >= 2) { const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; } return r; };
  const dataCw = v => Math.floor(rawMods(v) / 8) - ECC[v] * BLK[v];
  const mul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z & 0xFF; };
  const div = d => { const r = new Array(d - 1).fill(0).concat([1]); let root = 1; for (let i = 0; i < d; i++) { for (let j = 0; j < r.length; j++) { r[j] = mul(r[j], root); if (j + 1 < r.length) r[j] ^= r[j + 1]; } root = mul(root, 2); } return r; };
  const rem = (data, dv) => { const r = dv.map(() => 0); for (const b of data) { const f = b ^ r.shift(); r.push(0); dv.forEach((c, i) => { r[i] ^= mul(c, f); }); } return r; };
  const bit = (x, i) => ((x >>> i) & 1) !== 0;
  function make(text) {
    const bytes = Array.from(new TextEncoder().encode(text));
    let v = 1; while (v <= 10 && 4 + (v < 10 ? 8 : 16) + bytes.length * 8 > dataCw(v) * 8) v++;
    if (v > 10) throw new Error('texto largo para QR');
    const bits = []; const put = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(4, 4); put(bytes.length, v < 10 ? 8 : 16); bytes.forEach(b => put(b, 8));
    const cap = dataCw(v) * 8; put(0, Math.min(4, cap - bits.length)); put(0, (8 - bits.length % 8) % 8);
    for (let p = 0xEC; bits.length < cap; p ^= 0xEC ^ 0x11) put(p, 8);
    const data = []; for (let i = 0; i < bits.length; i += 8) { let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j]; data.push(b); }
    const nb = BLK[v], el = ECC[v], raw = Math.floor(rawMods(v) / 8), nShort = nb - raw % nb, sLen = Math.floor(raw / nb), dv = div(el);
    const blocks = []; for (let i = 0, k = 0; i < nb; i++) { const dat = data.slice(k, k + sLen - el + (i < nShort ? 0 : 1)); k += dat.length; const ec = rem(dat, dv); if (i < nShort) dat.push(0); blocks.push(dat.concat(ec)); }
    const cw = []; for (let i = 0; i < blocks[0].length; i++) blocks.forEach((b, j) => { if (i !== sLen - el || j >= nShort) cw.push(b[i]); });
    const n = v * 4 + 17, M = Array.from({ length: n }, () => new Array(n).fill(false)), F = Array.from({ length: n }, () => new Array(n).fill(false));
    const set = (x, y, d) => { M[y][x] = d; F[y][x] = true; };
    for (let i = 0; i < n; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    const finder = (cx, cy) => { for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) { const x = cx + dx, y = cy + dy; if (x >= 0 && x < n && y >= 0 && y < n) { const d = Math.max(Math.abs(dx), Math.abs(dy)); set(x, y, d !== 2 && d !== 4); } } };
    finder(3, 3); finder(n - 4, 3); finder(3, n - 4);
    if (v >= 2) {
      const na = Math.floor(v / 7) + 2, step = Math.ceil((v * 4 + 4) / (na * 2 - 2)) * 2, pos = [6];
      for (let p = n - 7; pos.length < na; p -= step) pos.splice(1, 0, p);
      pos.forEach((y, i) => pos.forEach((x, j) => { if ((i === 0 && j === 0) || (i === 0 && j === na - 1) || (i === na - 1 && j === 0)) return; for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(x + dx, y + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1); }));
    }
    const fmt = mask => { const d = (0 << 3) | mask; let r = d; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537); const b = ((d << 10) | r) ^ 0x5412;
      for (let i = 0; i <= 5; i++) set(8, i, bit(b, i)); set(8, 7, bit(b, 6)); set(8, 8, bit(b, 7)); set(7, 8, bit(b, 8)); for (let i = 9; i < 15; i++) set(14 - i, 8, bit(b, i));
      for (let i = 0; i < 8; i++) set(n - 1 - i, 8, bit(b, i)); for (let i = 8; i < 15; i++) set(8, n - 15 + i, bit(b, i)); set(8, n - 8, true); };
    fmt(0);
    if (v >= 7) { let r = v; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25); const b = (v << 12) | r; for (let i = 0; i < 18; i++) { const a = n - 11 + i % 3, c = Math.floor(i / 3); set(a, c, bit(b, i)); set(c, a, bit(b, i)); } }
    let i = 0; for (let right = n - 1; right >= 1; right -= 2) { if (right === 6) right = 5; for (let vert = 0; vert < n; vert++) for (let j = 0; j < 2; j++) { const x = right - j, up = ((right + 1) & 2) === 0, y = up ? n - 1 - vert : vert; if (!F[y][x] && i < cw.length * 8) { M[y][x] = bit(cw[i >>> 3], 7 - (i & 7)); i++; } } }
    const MK = [(x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, x => x % 3 === 0, (x, y) => (x + y) % 3 === 0, (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => x * y % 2 + x * y % 3 === 0, (x, y) => (x * y % 2 + x * y % 3) % 2 === 0, (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0];
    const apply = k => { for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (!F[y][x] && MK[k](x, y)) M[y][x] = !M[y][x]; };
    const penalty = () => { let p = 0, dark = 0;
      for (let y = 0; y < n; y++) for (let ax = 0; ax < 2; ax++) { let run = 1; for (let x = 1; x < n; x++) { const a = ax ? M[x][y] : M[y][x], b = ax ? M[x - 1][y] : M[y][x - 1]; if (a === b) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1; } }
      for (let y = 0; y < n - 1; y++) for (let x = 0; x < n - 1; x++) { const c = M[y][x]; if (c === M[y][x + 1] && c === M[y + 1][x] && c === M[y + 1][x + 1]) p += 3; }
      M.forEach(r => r.forEach(c => { if (c) dark++; })); p += Math.floor(Math.abs(dark * 20 - n * n * 10) / (n * n)) * 10; return p; };
    let best = 0, bestP = Infinity; for (let k = 0; k < 8; k++) { apply(k); fmt(k); const p = penalty(); if (p < bestP) { bestP = p; best = k; } apply(k); }
    apply(best); fmt(best);
    return M;
  }
  function svg(text, { dark = '#11181A', light = '#FFFFFF', quiet = 4 } = {}) {
    const M = make(text), n = M.length, s = n + quiet * 2; let d = '';
    M.forEach((row, y) => row.forEach((c, x) => { if (c) d += `M${x + quiet} ${y + quiet}h1v1h-1z`; }));
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${s} ${s}" shape-rendering="crispEdges" role="img" aria-label="Código QR"><rect width="${s}" height="${s}" fill="${light}"/><path d="${d}" fill="${dark}"/></svg>`;
  }
  return { make, svg };
})();
</script>

const app = document.getElementById('app');
const get = () => { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } };
async function api(datos) {
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 8000);
  try { const r = await fetch(CFG.endpoint, { method: 'POST', body: JSON.stringify({ token: CFG.token, equipo: 'pantalla', ...datos }), signal: ctl.signal, redirect: 'follow' }); return await r.json(); }
  catch (e) { return null; } finally { clearTimeout(to); }
}
async function firma(clave, texto, n) {
  const enc = new TextEncoder(), k = await crypto.subtle.importKey('raw', enc.encode(clave), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const b = new Uint8Array(await crypto.subtle.sign('HMAC', k, enc.encode(texto))); let s = ''; for (let i = 0; i < n; i++) s += ALF[b[i] % 32]; return s;
}
function login(msg) {
  app.innerHTML = `<img class="logo" src="${CFG.logo}" alt="Farmaonline"><h1>Pantalla del stand</h1><p>${msg || 'Ingresá la clave del equipo (una sola vez, con señal).'}</p>
    <form id="f"><label for="k" style="text-align:left;font-size:14px">Clave del equipo</label><input id="k" type="password" autocomplete="off" minlength="12"><button>Mostrar el QR en vivo</button></form>`;
  document.getElementById('f').onsubmit = async ev => {
    ev.preventDefault(); const staff = document.getElementById('k').value; const r = await api({ accion: 'pantalla', staff });
    if (!r) return login('Sin conexión con la planilla. Buscá señal y probá de nuevo.');
    if (!r.ok) return login('Clave incorrecta.');
    // se guardan sólo las claves de hoy y mañana (no la clave del equipo): si alguien las copia, no sirven otro día
    localStorage.setItem(KEY, JSON.stringify({ claves: r.claves, offset: r.ahora - Date.now() })); vivo();
  };
}
let ventana = -1;
async function tic() {
  const s = get(); if (!s) return login();
  const now = Date.now() + (s.offset || 0), w = Math.floor(now / 60000);
  document.getElementById('bar').style.width = (100 - ((now % 60000) / 600)) + '%';
  if (w === ventana) return; ventana = w;
  const clave = s.claves && s.claves[Math.floor((w * 60000 - 3 * 3600000) / 86400000)];
  if (!clave) { localStorage.removeItem(KEY); return login('Empezó otro día: ingresá de nuevo la clave del equipo.'); }
  const t = await firma(clave, 'vivo:' + w, 5);
  const url = location.origin + location.pathname.replace(/pantalla\.html$/, 'activar.html') + '?t=' + t;
  document.getElementById('qr').innerHTML = QR.svg(url);
  document.getElementById('qr').dataset.url = url;
}
function vivo() {
  app.innerHTML = `<img class="logo" src="${CFG.logo}" alt="Farmaonline"><h1>Activá tu premio <em>acá</em></h1>
    <p>Escaneá con la cámara de tu celular, después de jugar</p><div id="qr" role="img" aria-label="Código QR para activar el premio"></div>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div><p style="font-size:clamp(13px,1.8vh,20px);opacity:.75">El código cambia cada minuto: escanealo en el momento, frente al stand</p>
    <button id="salir">Salir</button>`;
  document.getElementById('salir').onclick = () => { if (confirm('¿Cerrar la pantalla del stand?')) { localStorage.removeItem(KEY); ventana = -1; login(); } };

}
// cada 10 minutos, si hay señal, corrige el reloj con la hora de la planilla
setInterval(async () => { const s = get(); if (!s || !navigator.onLine) return; const r = await api({ accion: 'hora' }); if (r && r.ok) localStorage.setItem(KEY, JSON.stringify({ ...s, offset: r.ahora - Date.now() })); }, 600000);
setInterval(() => { if (document.getElementById('bar')) tic(); }, 1000);
(async function wake() { try { await navigator.wakeLock.request('screen'); } catch (e) { } document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(); }, { once: true }); })();
if (!CFG.endpoint) app.innerHTML = '<h1>Falta conectar la planilla</h1><p>Completá endpoint y token en la configuración del juego.</p>'; else get() ? vivo() : login();
</script>
