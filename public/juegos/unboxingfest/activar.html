// Activación del premio con la llave del stand: ?t= (QR en vivo de la pantalla, cambia cada minuto) o ?c= (tarjeta única).
const CFG = { endpoint: '', token: '', prefix: 'FO' };
const LKEY = 'gsg_stand_leads_v1', GAMES = [['farmaonline-abrilo-vos.html', 'Abrilo vos'], ['farmaonline-ruta-del-pedido.html', 'La ruta del pedido'], ['farmaonline-cuidado-en-el-festi.html', 'Cuidado en el festi']];
const $ = s => document.querySelector(s), app = $('#app');
const get = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const set = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } };
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
const q = new URLSearchParams(location.search);
const t = (q.get('t') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
const c = (q.get('c') || '').toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 16);
const RE = new RegExp('^' + CFG.prefix + '-[A-Z2-9]{7}$');
const misLeads = () => get(LKEY, []).filter(l => RE.test(l.codigo || ''));
const juegos = extra => '<p>Elegí un juego:</p>' + GAMES.map(([f, n]) => `<a class="btn" href="${f}?o=${extra}#qr">${n}</a>`).join('');
async function api(datos) {
  if (!CFG.endpoint || !navigator.onLine) return null;
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 8000);
  try { const r = await fetch(CFG.endpoint, { method: 'POST', body: JSON.stringify({ token: CFG.token, accion: 'activar', equipo: 'activar', ...datos }), signal: ctl.signal, redirect: 'follow' }); return await r.json(); }
  catch (e) { return null; } finally { clearTimeout(to); }
}
async function activar(codigo) {
  app.innerHTML = '<h1>Activando tu premio…</h1>';
  const lead = get(LKEY, []).find(l => l.codigo === codigo);
  const r = await api({ codigo, t: t || undefined, c: c || undefined, lead: lead && !lead.enviado ? lead : undefined });
  const e = r && r.ok ? r.estado : null;
  if (e === 'ok') {
    const all = get(LKEY, []); all.forEach(l => { if (l.codigo === codigo) { l.activado = true; l.enviado = true; } }); set(LKEY, all);
    app.innerHTML = `<h1 class="ok">✓ Premio activado</h1><p>Mostrá este código en el mostrador del stand y retirá tu premio:</p><div class="code">${esc(codigo)}</div><p class="small">Es personal y de un solo uso. Sujeto a stock; si se agotó, te damos un cupón online.</p>`;
    return;
  }
  const msj = {
    llave_vencida: 'El QR de la pantalla ya cambió. Volvé a escanearlo: se renueva cada minuto.',
    no_existe: 'Todavía no nos llegó tu código. Abrí el juego con señal un momento y volvé a escanear.',
    duplicado: 'Ese email o WhatsApp ya tenía un premio: es uno por persona.',
    tarjeta_usada: 'Esa tarjeta ya se usó.', tarjeta_invalida: 'Esa tarjeta no es válida.', sin_llave: 'Escaneá el QR de la pantalla del stand.',
  }[e] || 'Sin conexión. Buscá señal y volvé a escanear el QR de la pantalla.';
  app.innerHTML = `<h1 class="bad">No se activó</h1><p>${msj}</p><div class="code">${esc(codigo)}</div><p class="small">Si no funciona, acercate al mostrador: te lo activan ahí.</p>`;
}
function pedirCodigo() {
  app.innerHTML = `<h1>Activá tu premio</h1><p>No encontramos tu código en este celular. Si jugaste en otro equipo, escribilo:</p>
    <form id="f"><label for="cod" class="small">Tu código</label><input id="cod" placeholder="${CFG.prefix}-XXXXXXX" autocomplete="off" autocapitalize="characters"><button class="btn">Activar</button></form>
    <p class="small" style="margin-top:18px">¿Todavía no jugaste?</p>${juegos(t ? 'stand-vivo' : 'tarjeta')}`;
  $('#f').onsubmit = ev => { ev.preventDefault(); const v = $('#cod').value.toUpperCase().replace(/\s/g, '').replace(/^([A-Z]{2})([A-Z2-9]{7})$/, '$1-$2'); if (RE.test(v)) activar(v); else $('#cod').setAttribute('aria-invalid', 'true'); };
}
(function () {
  if (!t && !c) { app.innerHTML = '<h1>Activá tu premio</h1><p>Escaneá con la cámara de tu celular el QR de la pantalla del stand de Farmaonline.</p>'; return; }
  const mios = misLeads().filter(l => !l.activado);
  if (mios.length) return activar(mios[mios.length - 1].codigo);
  if (misLeads().length) { const l = misLeads().pop(); app.innerHTML = `<h1 class="ok">✓ Ya está activado</h1><p>Mostrá tu código en el mostrador:</p><div class="code">${esc(l.codigo)}</div>`; return; }
  // tarjeta sin haber jugado: queda guardada y el premio se activa solo al terminar la partida
  if (c) { set('gsg_tarjeta', c); app.innerHTML = `<h1>¡Tu tarjeta está lista!</h1><p>Jugá una partida: al terminar y dejar tus datos, tu premio queda activado solo.</p>${juegos('tarjeta')}`; return; }
  pedirCodigo();
})();
</script>
</body></html>
